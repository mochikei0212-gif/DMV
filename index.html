ger car"],"explain":"A large truck is heavy and needs more distance and time to stop than a car.","src":"Past Exam #110"},{"id":135,"catKey":"lanes","correct":1,"q":"On a freeway with a 65 mph speed limit, you're driving 55 mph in the leftmost lane. Could you be fined for driving too slowly?","choices":["Yes, if you need to drive slowly due to road or weather conditions","Yes, if you're impeding the normal and reasonable flow of traffic","No — it's always safer to drive slower than other cars, so you can't be fined"],"explain":"Unless conditions require it, you can be ticketed for driving so slowly that you impede normal traffic.","src":"Past Exam #111"},{"id":136,"catKey":"lanes","correct":1,"q":"Which of the following about blind spots is correct?","choices":["You only need to look back over your right shoulder, whether changing to the right or left lane","Look back over your right shoulder for a right lane change, and your left shoulder for a left lane change","A car with mirrors on both outside sides has no blind spots"],"explain":"Look over your right shoulder when moving right, and your left when moving left. Mirrors don't remove blind spots.","src":"Past Exam #112"},{"id":137,"catKey":"defensive","correct":2,"q":"If your car starts to skid, what should you do?","choices":["Drive at a constant speed to regain traction","Press the brake firmly to stop the slide","Ease off gradually and slow down — don't hit the brake"],"explain":"If you start to skid, slowly ease off the accelerator and don't use the brakes.","src":"Past Exam #113"},{"id":138,"catKey":"dui","correct":0,"q":"If you're arrested for DUI and refuse a chemical test of your blood alcohol content:","choices":["Your license will be suspended for at least one year","You cannot be forced to give a blood sample","You have the right to speak with an attorney before testing"],"explain":"Refusing a chemical test suspends your driving privilege for at least one year.","src":"Past Exam #114"},{"id":139,"catKey":"lanes","correct":2,"q":"Which of the following about making a U-turn in a business district is correct?","choices":["It's always illegal, since it's dangerous","It's not a violation near a church, apartment building, or social club","It's allowed at an intersection unless a sign specifically prohibits it"],"explain":"In a business district, U-turns are allowed at intersections unless a sign prohibits them.","src":"Past Exam #115"},{"id":140,"catKey":"weather","correct":1,"q":"When is it acceptable to drive using only your parking lights?","choices":["30 minutes after sunset and 30 minutes before sunrise","Never","On a low-visibility foggy day"],"explain":"Driving with only parking lights is never allowed. Use your headlights when lights are needed.","src":"Past Exam #116"},{"id":141,"catKey":"lanes","correct":1,"q":"What do two solid yellow lines, spaced 2 feet (about 60 cm) or more apart, mean?","choices":["You may cross only to enter a private driveway","They should be treated like a wall — you may not cross them","They mark the start or end of a left-turn lane"],"explain":"Two sets of double solid yellow lines two or more feet apart are a barrier. Don't cross them, turn left, or make a U-turn except at designated openings.","src":"Past Exam #117"},{"id":142,"catKey":"lanes","correct":1,"q":"At night, an oncoming car's headlights are on high beam. What should you do?","choices":["Quickly flash your own high beams to signal the other driver","Look toward the right lane or the right edge of the road","Slow down and look straight ahead"],"explain":"Don't look directly at the lights. Look toward the right lane or the right edge of the road.","src":"Past Exam #118"},{"id":143,"catKey":"weather","correct":1,"q":"You turn your headlights on in rain, snow, or fog mainly:","choices":["To use your high beams","So other drivers can see your car","To warn other drivers that the weather is bad"],"explain":"You turn on headlights in bad weather so other drivers can see you.","src":"Past Exam #119"},{"id":144,"catKey":"defensive","correct":0,"q":"If no speed limit is posted, what is the speed limit in a business district?","choices":["25 mph","20 mph","30 mph"],"explain":"With no sign posted, the limit in a business district is 25 mph.","src":"Past Exam #120"},{"id":145,"catKey":"defensive","correct":2,"q":"An oncoming car has started to turn left in front of you. What should you do?","choices":["Honk to warn them and keep driving at the same speed","Steer to the right to get around the car before it finishes turning","Slow down or stop to avoid a collision"],"explain":"If the other car has begun to turn, slow down or stop to avoid a collision, even if you have the right-of-way.","src":"Past Exam #121"},{"id":146,"catKey":"signs","correct":2,"q":"A sign above the left-turn lane reads \"LEFT TURN OR U-TURN ALLOWED ON A LEFT ARROW ONLY.\" What does this mean?","choices":["You must make either a left turn or a U-turn","You may turn left or make a U-turn on any green signal","You may turn left or make a U-turn only when a green arrow is shown"],"explain":"With this sign, you may turn left or make a U-turn only on a green left arrow.","src":"Past Exam #122","img":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNDAgMTUwIj48cmVjdCB4PSIzIiB5PSIzIiB3aWR0aD0iMjM0IiBoZWlnaHQ9IjE0NCIgZmlsbD0iI2ZmZiIgc3Ryb2tlPSIjMDAwIiBzdHJva2Utd2lkdGg9IjUiLz48ZyBmb250LWZhbWlseT0iQXJpYWwsSGVsdmV0aWNhLHNhbnMtc2VyaWYiIGZvbnQtd2VpZ2h0PSI3MDAiIGZvbnQtc2l6ZT0iMjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiMwMDAiPjx0ZXh0IHg9IjEyMCIgeT0iMzYiPkxFRlQgVFVSTiBPUjwvdGV4dD48dGV4dCB4PSIxMjAiIHk9IjY0Ij5VLVRVUk4gT048L3RleHQ+PHRleHQgeD0iOTYiIHk9IjkyIj5BUlJPVzwvdGV4dD48dGV4dCB4PSIxNzAiIHk9IjkyIj48L3RleHQ+PHRleHQgeD0iMTIwIiB5PSIxMzAiPk9OTFk8L3RleHQ+PC9nPjxwYXRoIGQ9Ik0xNzYgOTZWODRoLTIydi03bC0xMyAxMSAxMyAxMXYtN2gxNHY4eiIgZmlsbD0iIzAwMCIgdHJhbnNmb3JtPSJ0cmFuc2xhdGUoMCwtOCkiLz48L3N2Zz4="},{"id":147,"catKey":"lanes","correct":2,"q":"You're driving on a multi-lane road with a median in the middle, and you need to make a U-turn. From which lane should you start?","choices":["From the center lane","From any lane","From the left lane"],"explain":"On a multi-lane divided road, begin a U-turn from the left lane.","src":"Past Exam #123"},{"id":148,"catKey":"safety","correct":2,"q":"You must wear a seat belt while driving. Which of the following is correct?","choices":["Not required if the car has airbags","Not required if riding in the back of a pickup truck or camper","Required if the car is equipped with seat belts"],"explain":"If a seat belt is installed, you must wear it, even if the car has airbags.","src":"Past Exam #124"},{"id":149,"catKey":"signals","correct":1,"q":"You're in a turn-only lane at an intersection, and the signal is a green arrow. Which of the following is correct?","choices":["Vehicles or pedestrians already in the intersection must yield to you","All approaching vehicles and pedestrians must stop for their red light","You may turn in the arrow's direction without watching for other vehicles or pedestrians"],"explain":"During a green arrow, opposing traffic and pedestrians have a red light. Still watch for any already in the intersection.","src":"Past Exam #125"},{"id":150,"catKey":"defensive","correct":2,"q":"When backing your car out of a curved area, you should always back up slowly, and also:","choices":["Watch the rearview mirror while backing up","Watch the side mirrors while backing up","Look back over your right shoulder while backing up"],"explain":"When backing out of a curved space, go slowly and look back over your right shoulder.","src":"Past Exam #126"},{"id":151,"catKey":"signals","correct":1,"q":"Where should you stop your vehicle when there is no marked stop line?","choices":["Just past the corner of the intersection","At the corner of the intersection","On the far side of the crosswalk"],"explain":"With no limit line, stop before the corner of the intersection.","src":"Pa -way"],"explain":"Don't count on others to give you the right-of-way or to do what they've signaled.","src":"Past Exam #141"},{"id":157,"catKey":"highway","correct":1,"q":"You're in the leftmost lane of a 4-lane freeway, driving slower than other traffic, and the car behind you wants to go faster. You should:","choices":["Not need to change lanes if you're driving at the speed limit","Change lanes regardless of your own speed","Only need to change lanes if 5 or more cars are behind you"],"explain":"If you're slower than the traffic flow, move right and let faster cars by, whatever your speed.","src":"Past Exam #142"},{"id":158,"catKey":"dui","correct":0,"q":"If you're caught driving with a blood alcohol content over the legal limit:","choices":["An order suspending your driving privilege will be issued","A breath test result alone can never prove guilt","Your car will be impounded regardless of your license status"],"explain":"If you're caught over the legal BAC limit, an order suspending your driving privilege will be issued.","src":"Past Exam #143"},{"id":159,"catKey":"highway","correct":1,"q":"On a 4-lane freeway, you're driving in the lane closest to the center median. To exit via an exit on the right side of the freeway, you should:","choices":["Carefully cross all the lanes at once","Change one lane at a time until you're in the proper lane","Slow down every time you change lanes"],"explain":"Move toward your exit one lane at a time, signaling and checking each time. Don't cut across several lanes at once.","src":"Past Exam #144"},{"id":160,"catKey":"weather","correct":1,"q":"A road sign shows a speed limit of 55 mph, but the road is wet. What should you do?","choices":["Continue at 55 mph","Slow down by about 5 to 10 mph below the limit","Slow down by about 20 to 25 mph below the limit"],"explain":"On a wet road, reduce your speed by 5 to 10 mph.","src":"Past Exam #145"},{"id":161,"catKey":"highway","correct":0,"q":"When should you slow down while driving?","choices":["When you see brake lights on several cars ahead of you","When passing a large truck on the freeway","When passing an accident scene that's already been cleared"],"explain":"Brake lights on several cars ahead signal a slowdown. Slow down early.","src":"Past Exam #146"},{"id":162,"catKey":"weather","correct":2,"q":"If your car starts to skid on a slippery road, you should:","choices":["Pump the brakes repeatedly","Brake hard","Ease off the brake"],"explain":"If you start to skid, stop braking and let the car slow down.","src":"Past Exam #147"},{"id":163,"catKey":"defensive","correct":2,"q":"When driving at night, high-beam headlights should be used:","choices":["As little as possible","Only on unlit roads","Any time it's legal and safe to do so"],"explain":"Use high beams whenever it's legal and safe, so you can see farther. Dim them near other vehicles.","src":"Past Exam #148"},{"id":164,"catKey":"lanes","correct":1,"q":"You're driving on a road with a single lane in each direction, and the driver ahead keeps slowing down for no obvious reason. According to the California Driver Handbook, you should:","choices":["Speed up to pass the car ahead as soon as possible","Keep a generous distance between your car and the car ahead","Flash your headlights to get the driver's attention"],"explain":"Leave extra room behind a driver who is behaving unpredictably.","src":"Past Exam #149"},{"id":165,"catKey":"dmv","correct":2,"q":"If you're involved in a traffic accident, besides your license, what else should you show the other party?","choices":["Only your financial responsibility (insurance) card","Your financial responsibility card and vehicle registration","Your financial responsibility card, vehicle registration, and current address"],"explain":"Show the other driver your license, registration card, insurance information, and current address.","src":"Past Exam #150"},{"id":166,"catKey":"highway","correct":0,"q":"On a 3-lane freeway, a large truck is driving in the center lane, and you want to pass it. What should you do?","choices":["Pass quickly on the left and move ahead of the truck","Pass very slowly on the left and move ahead of the truck","Pass very quickly on the right and move ahead of the truck"],"explain":"Trucks have large blind spots. Pass quickly on the left and don't linger beside them.","src":"Past Exam #151"},{"id":167,"catKey":"defensive","correct":0,"q":"A car behind you looks like it's about to rear-end you. What should you do?","choices":["Be ready to brake once you're actually hit","Keep your foot on the brake the whole time","Shift to neutral and turn off the engine"],"explain":"If you're about to be rear-ended, be ready to brake after impact so you can keep control of the car.","src":"Past Exam #152"},{"id":168,"catKey":"defensive","correct":1,"q":"When backing up your car, what should you do?","choices":["Rely on your rearview mirror","Look through the rear window","Rely on your rearview and side mirrors"],"explain":"When backing, look through the rear window rather than relying only on mirrors.","src":"Past Exam #153"},{"id":169,"catKey":"defensive","correct":1,"q":"What happens if you drive slower than the overall flow of traffic?","choices":["It's less likely to cause an accident","It's more likely to cause an accident","It has no effect either way"],"explain":"Driving much slower than everyone else creates speed differences that make crashes more likely.","src":"Past Exam #154"},{"id":170,"catKey":"signals","correct":0,"q":"After stopping at a railroad crossing, when is it safe to cross the tracks?","choices":["When you have a clear view in both directions","Right after a train has passed","When you can't see a train at all"],"explain":"Another train may be coming, so cross only when you can clearly see in both directions.","src":"Past Exam #155"},{"id":171,"catKey":"weather","correct":0,"q":"In dense fog or heavy blowing dust, you should:","choices":["Not drive until conditions improve","Avoid driving too slowly, since that risks a collision with other cars","Alternate between low and high beams for better visibility"],"explain":"In dense fog or heavy dust, it's best not to drive until conditions improve.","src":"Past Exam #156"},{"id":172,"catKey":"signs","correct":1,"q":"What does a sign with a right-pointing arrow and \"ONE WAY\" mean?","choices":["There's a one-lane road to the right","A one-way road running to the right","All cars must turn right ahead"],"explain":"The ONE WAY arrow shows a road where traffic moves only in that direction.","src":"Past Exam #157","img":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNDAgNzAiPgogIDxyZWN0IHg9IjQiIHk9IjQiIHdpZHRoPSIxMzIiIGhlaWdodD0iNjIiIGZpbGw9IiMwMDAwMDAiIHN0cm9rZT0iI0ZGRkZGRiIgc3Ryb2tlLXdpZHRoPSIyIi8+CiAgPHRleHQgeD0iNTUiIHk9IjQyIiBmb250LWZhbWlseT0iQXJpYWwsIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjAiIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiNGRkZGRkYiIHRleHQtYW5jaG9yPSJtaWRkbGUiPk9ORSBXQVk8L3RleHQ+CiAgPGxpbmUgeDE9IjEwNSIgeTE9IjM1IiB4Mj0iMTI4IiB5Mj0iMzUiIHN0cm9rZT0iI0ZGRkZGRiIgc3Ryb2tlLXdpZHRoPSI1Ii8+CiAgPHBvbHlnb24gcG9pbnRzPSIxMjgsMzUgMTE4LDI3IDExOCw0MyIgZmlsbD0iI0ZGRkZGRiIvPgo8L3N2Zz4="},{"id":174,"catKey":"lanes","correct":2,"q":"You're driving in the left lane of a two-lane road, and many cars are passing you on the right. What should you do?","choices":["Stay in the left lane so you don't disrupt the flow of traffic","Pull over onto the left shoulder and stop to let the other cars go first","Merge into the right lane when it's safe to do so"],"explain":"If cars keep passing you on the right, you're too slow for that lane. Move right when it's safe.","src":"Past Exam #159"},{"id":175,"catKey":"lanes","correct":1,"q":"A broken yellow line runs alongside a solid yellow line. Which car may cross the line to pass?","choices":["Cars in either direction may cross","Only the car whose side has the broken line","Only the car whose side has the solid line"],"explain":"A car on the broken-line side may cross to pass if it's safe to do so, but a car on the solid-line side may not cross."},{"id":176,"catKey":"parking","correct":1,"q":"Which of the following is a situation where you should NOT park with your front wheels pointed straight ahead?","choices":["Waiting your turn to turn left at a signal","Parking on a hill or a sloped driveway","Parking on a flat road with no curb"],"explain":"When parking on a hill or slope, you need to angle your front wheels so that if the car does start rolling, the damage is limited."},{"id":178,"catKey":"defensive","correct":2,"q":"What is the biggest danger that fatigue poses while driving?","choices":["Missing your intended exit","Being late for an appointment","Falling asleep at the wheel and causing an accident"],"explain":"Accumulated fatigue can cause you to fall asleep while driving, creating a risk of a serious accident."},{"id":179,"catKey":"weather","correct":0,"q":"Which of the following about speed on a dark, unlit road at night is correct?","choices":["Drive at a speed that lets you stop safely within the range your headlights illuminate","Use high beams so you can clearly see the vehicle ahead","Brighten your dashboard lights so other drivers can see you"],"explain":"If you drive faster than your headlights' range, you won't be able to stop in time even if you spot an obstacle."},{"id":180,"catKey":"signs","correct":1,"q":"What does a yellow pennant (triangular flag) shaped sign indicate?","choices":["A school zone","A no-passing zone","A speed limit"],"explain":"A pennant-shaped sign indicates that a no-passing zone begins ahead.","img":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNDAgMTAwIj4KICA8cG9seWdvbiBwb2ludHM9IjgsMTUgMTMyLDUwIDgsODUiIGZpbGw9IiNGNUQzM0MiIHN0cm9rZT0iIzAwMDAwMCIgc3Ryb2tlLXdpZHRoPSIzIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+Cjwvc3ZnPg=="},{"id":181,"catKey":"dui","correct":1,"q":"Which of the following about driving and drugs is correct?","choices":["Any prescription drug is safe to use while driving as long as you don't feel drowsy","Even over-the-counter (OTC) medicine can impair your ability to drive","Only illegal drugs can impair your ability to drive"],"explain":"Not just prescription drugs — even over-the-counter medicine can cause drowsiness or reduced alertness and affect your driving."},{"id":182,"catKey":"lanes","correct":1,"q":"Which of the following about the meaning of a broken yellow line down the center of a road is correct?","choices":["It marks lanes on a one-way road","It indicates a two-way road","It's a median separating regular lanes from the roadway"],"explain":"A broken yellow center line indicates a two-way road with opposing traffic."},{"id":183,"catKey":"weather","correct":2,"q":"Strong wind is blowing sand and dust, reducing visibility on the freeway. What should you do?","choices":["Slow down and turn on your interior light","Slow down and turn on your parking lights","Slow down and turn on your headlights"],"explain":"In low-visibility conditions, slow down and turn on your headlights at the same time to let other vehicles know you're there."},{"id":184,"catKey":"defensive","correct":1,"q":"What does California's \"Basic Speed Law\" establish?","choices":["You must never exceed the speed limit posted on signs","You must never drive faster than is safe for the current conditions","You may drive up to 70 mph uniformly on all California freeways"],"explain":"The Basic Speed Law states that even below the posted limit, you must never exceed a speed that's safe for the weather, traffic, and other conditions at the time."},{"id":185,"catKey":"signs","correct":0,"q":"What does a warning sign that reads \"DIVIDED HIGHWAY ENDS\" mean?","choices":["The section with a median ahead is about to end","The road curves sharply ahead","Two-way traffic begins ahead"],"explain":"This sign warns that the section of road with a median that you've been driving on is about to end.","img":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj4KICA8cmVjdCB4PSIxNSIgeT0iMTUiIHdpZHRoPSI3MCIgaGVpZ2h0PSI3MCIgZmlsbD0iI0ZGRkZGRiIgc3Ryb2tlPSIjMDAwMDAwIiBzdHJva2Utd2lkdGg9IjMiIHRyYW5zZm9ybT0icm90YXRlKDQ1IDUwIDUwKSIvPgogIDxyZWN0IHg9IjQ4IiB5PSI0OCIgd2lkdGg9IjQiIGhlaWdodD0iMjIiIGZpbGw9IiMwMDAwMDAiLz4KICA8bGluZSB4MT0iMzQiIHkxPSIxOCIgeDI9IjUwIiB5Mj0iNDgiIHN0cm9rZT0iIzAwMDAwMCIgc3Ryb2tlLXdpZHRoPSI0Ii8+CiAgPGxpbmUgeDE9IjY2IiB5MT0iMTgiIHgyPSI1MCIgeTI9IjQ4IiBzdHJva2U9IiMwMDAwMDAiIHN0cm9rZS13aWR0aD0iNCIvPgogIDxwb2x5Z29uIHBvaW50cz0iNTAsNjggNDUsNTggNTUsNTgiIGZpbGw9IiMwMDAwMDAiLz4KPC9zdmc+"},{"id":186,"catKey":"parking","correct":1,"q":"If you must park somewhere that isn't normally used for parking, what should you keep in mind?","choices":["Leave your backup lights on","Make sure your car is visible to drivers approaching from any direction","Park 5 feet away from the curb"],"explain":"When parking somewhere unusual, make sure your car is clearly visible to drivers around you to prevent accidents."},{"id":188,"catKey":"lanes","correct":1,"q":"Which of the following about driving on a multi-lane, two-way road is correct?","choices":["Drive alongside another car so the other driver can see you","Try to drive ahead of or behind other cars, not alongside them","It's safest to drive in the lane right next to the center line"],"explain":"Driving alongside a car in the opposite lane for an extended time puts you at risk in each other's blind spot, so try to position yourself ahead of or behind other cars instead."},{"id":190,"catKey":"weather","correct":2,"q":"What should you do if your car's traction starts to decrease due to water on the road?","choices":["Maintain a constant speed","Press firmly on the brake so the car doesn't slide","Slow down gradually, and avoid pressing the brake hard"],"explain":"Braking hard risks further skidding, so it's safer to ease off the accelerator and slow down gradually."},{"id":191,"catKey":"highway","correct":1,"q":"You're driving in the center lane of a freeway and cars keep passing you on both the right and the left. What should you do?","choices":["Keep driving in the center lane","Move into the right lane","Move into the left lane"],"explain":"Being passed on both sides while in the center lane is a sign you're driving slower than the flow of traffic, so you should generally move to the right lane."},{"id":192,"catKey":"parking","correct":1,"q":"What must you always do when parking on a hill?","choices":["Have one of the rear wheels touch the curb","Set the parking brake and leave the car in Park (or in gear)","Always keep the front wheels parallel to the road"],"explain":"When parking on a hill, in addition to positioning your front wheels correctly, it's standard practice to set the parking brake and leave the transmission in Park (automatic) or in gear (manual)."},{"id":193,"catKey":"lanes","correct":1,"q":"A large truck or bus ahead is about to turn left or right on a two-lane (each direction) road. What should you watch for?","choices":["A large vehicle can complete the turn from either of the two lanes","A large vehicle may need to swing wide into the adjacent lane to complete the turn","A large vehicle always uses only the far lane while turning"],"explain":"Because large vehicles have a long wheelbase and can't turn as tightly, they sometimes need the adjacent lane's space to complete a turn. Don't try to squeeze in alongside one."},{"id":194,"catKey":"defensive","correct":0,"q":"On a two-lane road, a car behind you is following way too closely (tailgating). What's the best response?","choices":["Keep your course and speed, then move right when safe to let them pass","Speed up to increase the distance","Brake once to slow down, then return to your original speed"],"explain":"The handbook says to maintain your course and speed, then merge right when it is safe so the tailgater can pass."},{"id":195,"catKey":"defensive","correct":0,"q":"Which of the following about stopping distance and crash severity is correct?","choices":["Both stopping distance and crash severity increase as speed increases","Neither is affected by the vehicle's speed","Stopping distance decreases as speed increases"],"explain":"As speed increases, the distance needed to stop gets longer, and the energy involved in a crash gets greater, making the damage more severe."},{"id":196,"catKey":"highway","correct":0,"q":"When driving on a freeway, how should you adjust where you look compared to driving on city streets?","choices":["Look farther ahead to spot hazards early","Focus only on the bumper of the car ahead of you","There's no need to look around on freeways"],"explain":"Because freeway speeds are higher and stopping distances are longer, you need to look farther ahead than you would on city streets to spot hazards early."},{"id":197,"catKey":"signs","correct":2,"q":"A road sign ahead indicates \"LOW CLEARANCE AHEAD\" for an overpass or tunnel. What should you do?","choices":["Understand that a divided freeway is starting","Understand that a steep downgrade is coming up","Check whether your vehicle's height is within the posted clearance"],"explain":"When you see a low-clearance sign, trucks and vehicles carrying tall loads especially need to confirm they won't hit the overpass or tunnel.","img":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNDAgOTAiPgogIDxyZWN0IHg9IjQiIHk9IjQiIHdpZHRoPSIxMzIiIGhlaWdodD0iODIiIGZpbGw9IiNGNUQzM0MiIHN0cm9rZT0iIzAwMDAwMCIgc3Ryb2tlLXdpZHRoPSIzIi8+CiAgPHRleHQgeD0iNzAiIHk9IjM0IiBmb250LWZhbWlseT0iQXJpYWwsIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTMiIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMwMDAwMDAiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkxPVzwvdGV4dD4KICA8dGV4dCB4PSI3MCIgeT0iNTYiIGZvbnQtZmFtaWx5PSJBcmlhbCwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxMyIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzAwMDAwMCIgdGV4dC1hbmNob3I9Im1pZGRsZSI+Q0xFQVJBTkNFPC90ZXh0PgogIDx0ZXh0IHg9IjcwIiB5PSI3OCIgZ  while in the left lane"],"explain":"A broken white line indicates that you may cross it to change lanes or pass (a solid line means you may not)."},{"id":206,"catKey":"parking","correct":1,"q":"When parallel parking on a flat road, which of the following is correct?","choices":["Point the front wheels toward the center of the road","Keep your wheels within 18 inches of the curb","One of the rear wheels must touch the curb"],"explain":"When parking parallel to a curb, your wheels should be within 18 inches (about 45 cm) of the curb."},{"id":209,"catKey":"parking","correct":1,"q":"What does a curb painted white mean?","choices":["A zone for loading/unloading freight or passengers","A short-term stopping zone for passenger loading or mail only","A zone reserved for loading freight only"],"explain":"A white curb indicates a short-term stopping zone for picking up/dropping off passengers or for mail."},{"id":210,"catKey":"dmv","correct":0,"q":"Which of the following vehicles can generally be driven with a standard \"Class C\" driver's license?","choices":["A 3-axle vehicle with a gross weight under 6,000 lbs","Any 3-axle vehicle, regardless of weight","A vehicle towing two trailers"],"explain":"A standard Class C license covers 3-axle vehicles up to a gross weight of 6,000 lbs."},{"id":211,"catKey":"lanes","correct":1,"q":"When making a left turn from a multi-lane one-way road onto another one-way road, which lane should you begin the turn from?","choices":["Any lane, as long as it's safe","The lane nearest the left curb","The center lane of the road"],"explain":"When turning left from one one-way street onto another, begin the turn from the lane nearest the left curb, and enter the leftmost lane of the road you're turning onto."},{"id":212,"catKey":"dmv","correct":1,"q":"When must you file an \"SR1\" report with the DMV after a traffic accident?","choices":["Only if you or the other driver was injured","If property damage exceeds $1,000, or if anyone was injured","Only if you were at fault"],"explain":"An accident with more than $1,000 in property damage, or any injury, requires filing an SR1 report with the DMV."},{"id":215,"catKey":"dmv","correct":2,"q":"You hit a parked vehicle causing property damage, but can't find the owner. What should you do?","choices":["Leave a note with your contact information on the vehicle","Promptly report the accident to the police (or the CHP if outside city limits)","Both of the above"],"explain":"If you can't find the owner, you should leave a note on the vehicle and also report the accident to the police or CHP."},{"id":216,"catKey":"parking","correct":1,"q":"When parking uphill on a two-way road with no curb, which direction should your front wheels point?","choices":["Toward the road (travel lane)","Away from the road (to the right)","Always parallel to the road surface"],"explain":"On an uphill grade with no curb, turn your front wheels away from the road (to the right) so that if the car rolls back, it won't roll into traffic."},{"id":217,"catKey":"emergency","correct":0,"q":"Which of the following about the instructions of a school crossing guard is correct?","choices":["You must always follow their instructions","You only need to follow them during class hours","You can ignore them if there are no children present"],"explain":"You must always follow the instructions of a school crossing guard when one is present."},{"id":218,"catKey":"lanes","correct":0,"q":"What is a wrong assumption to avoid making when you're planning to pass another car?","choices":["Assuming the other driver will make room for you to return to your lane","Checking your surroundings before passing","Passing at a safe speed"],"explain":"Just because you signal doesn't guarantee the other driver will make room for you — you need to confirm it's safe yourself."},{"id":219,"catKey":"emergency","correct":1,"q":"You're stopped right in the middle of an intersection when you hear an emergency vehicle's siren. What should you do?","choices":["Move to the right and stop right there in the intersection","Continue straight through the intersection, then pull to the right and stop","Continue straight through the intersection, then pull to the left and stop"],"explain":"Don't stop in the middle of the intersection—continue through it safely first, then pull to the right side of the road and stop."},{"id":220,"catKey":"lanes","correct":1,"q":"On a road with one lane in each direction, what happens if you keep passing car after car?","choices":["You'll reach your destination faster and safely","It significantly increases your risk of a crash","It helps prevent traffic congestion"],"explain":"Repeatedly passing using the oncoming lane greatly increases the risk of a serious head-on collision."},{"id":221,"catKey":"signals","correct":0,"q":"Which of the following vehicles must always stop before crossing a railroad track?","choices":["A tanker truck displaying a hazardous materials placard","An RV or pickup truck towing a boat trailer","A vehicle with 3 or more axles, or a gross weight over 4,000 lbs"],"explain":"A vehicle carrying hazardous materials is required to always stop before a railroad crossing."},{"id":222,"catKey":"signals","correct":0,"q":"If there isn't enough room on the other side of the tracks to fully cross, what should you do?","choices":["Stop before the crossing and don't start to cross","It's fine to start crossing slowly","It's fine to cross if the car ahead of you made it across"],"explain":"Entering a crossing without enough room on the other side risks getting stuck on the tracks."},{"id":224,"catKey":"defensive","correct":0,"q":"Which of the following actions while driving is considered illegal?","choices":["Listening to music with headphones covering both ears","Adjusting your side mirrors","Transporting an unrestrained animal in the car"],"explain":"Driving while wearing headphones or earbuds that cover both ears is illegal because it prevents you from hearing sounds around you."},{"id":225,"catKey":"defensive","correct":0,"q":"What can happen if you follow another car's rear bumper too closely (so-called \"tailgating\")?","choices":["It can irritate and anger the other driver","You'll never get a ticket for it","It helps ease traffic congestion"],"explain":"Following too closely is very dangerous, and it can anger the other driver and lead to a confrontation."},{"id":226,"catKey":"defensive","correct":0,"q":"For safety, should you always drive slower than other cars?","choices":["No, driving too slowly can actually obstruct the flow of traffic","Yes, that's the best defensive driving technique","Yes, it's always safer than driving faster than other cars"],"explain":"Driving at an extremely slow speed can actually create danger, such as encouraging unsafe passing by cars behind you."},{"id":227,"catKey":"signs","correct":0,"q":"What should you do when you see a yellow circular sign with an \"RXR\" symbol (an advance railroad crossing warning sign)?","choices":["Be aware there's a railroad crossing ahead, and slow down in preparation for an approaching train","Understand that a freeway exit is near","Understand that the road ends ahead"],"explain":"This sign is not the crossing itself — it's an advance warning sign letting you know a railroad crossing is coming up.","img":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj4KICA8Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0NiIgZmlsbD0iI0Y1RDMzQyIgc3Ryb2tlPSIjMDAwMDAwIiBzdHJva2Utd2lkdGg9IjMiLz4KICA8bGluZSB4MT0iMzAiIHkxPSIzMCIgeDI9IjcwIiB5Mj0iNzAiIHN0cm9rZT0iIzAwMDAwMCIgc3Ryb2tlLXdpZHRoPSI1Ii8+CiAgPGxpbmUgeDE9IjcwIiB5MT0iMzAiIHgyPSIzMCIgeTI9IjcwIiBzdHJva2U9IiMwMDAwMDAiIHN0cm9rZS13aWR0aD0iNSIvPgogIDx0ZXh0IHg9IjI2IiB5PSI1NiIgZm9udC1mYW1pbHk9IkFyaWFsLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjE5IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMDAwMDAwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5SPC90ZXh0PgogIDx0ZXh0IHg9Ijc0IiB5PSI1NiIgZm9udC1mYW1pbHk9IkFyaWFsLCBzYW5zLXNlc  bike lane?","choices":["Slow down, wait until there's no oncoming traffic, then pass while leaving them enough room","Speed past them as quickly as possible","Drive very close to the cyclist"],"explain":"Slow down, wait for a gap in oncoming traffic, and pass while leaving the cyclist enough space to stay safe."},{"id":237,"catKey":"pedestrians","correct":0,"q":"Why do drivers need to pay extra attention to motorcyclists, cyclists, and pedestrians?","choices":["They're easy to miss in traffic","They rarely use the road","They're easy to spot"],"explain":"Motorcyclists, cyclists, and pedestrians are smaller and easier to miss in traffic, so drivers need to watch for them carefully."},{"id":238,"catKey":"dui","correct":0,"q":"What can happen if you drink alcohol while taking a prescription or over-the-counter medication?","choices":["It can lead to harmful interactions, reduced effectiveness, or increased side effects","It can reduce the medication's side effects","It has no effect on the medication at all"],"explain":"Combining alcohol with medication can cause unexpected interactions or change how the medication works, so caution is needed."},{"id":239,"catKey":"emergency","correct":0,"q":"What should you do when you see road construction signs ahead?","choices":["Slow down and be prepared to stop suddenly","Speed up to make up for lost time","Continue at your normal speed"],"explain":"In a construction zone, workers and equipment may be close to traffic, so slow down and be ready for sudden stops."},{"id":240,"catKey":"emergency","correct":0,"q":"An emergency vehicle with its siren and flashing red lights on is approaching you. What should you do?","choices":["Pull over to the right side of the road and stop","Keep driving at your current speed","Speed up as if racing the emergency vehicle"],"explain":"When an emergency vehicle with siren and flashing lights approaches, safely pull to the right side of the road and stop, allowing it to pass."},{"id":241,"catKey":"weather","correct":2,"q":"What should you keep in mind when driving on snowy or icy roads?","choices":["Drive considerably faster than usual","Drive the same way as on a clear day","Make speed and steering changes more gradually and smoothly than usual"],"explain":"On slippery roads, sudden inputs can cause a skid, so accelerate, brake, and steer more gently and gradually."},{"id":242,"catKey":"defensive","correct":1,"q":"What is the main reason traffic slows to a crawl when passing an accident scene?","choices":["Pedestrians are overflowing onto the sidewalk","Drivers slow down to look at the accident scene","The speed limit has changed"],"explain":"Many drivers slow down to look at an accident scene, which can cause traffic jams and even more accidents."},{"id":243,"catKey":"lanes","correct":2,"q":"When is it appropriate to pass another car?","choices":["When the car ahead is slow","When the car ahead is stopped at a red light","Only when it's safe and legal to do so"],"explain":"A car ahead being slow, stopped, or about to turn left isn't by itself a reason to pass — only pass when it's both safe and legal."},{"id":244,"catKey":"provisional","correct":1,"q":"What is the minimum age to apply for a learner's permit in California?","choices":["15 years old","15 years and 6 months old","16 years old"],"explain":"In California, you can apply for a learner's permit starting at age 15 years and 6 months."},{"id":245,"catKey":"provisional","correct":0,"q":"Who must accompany you when practicing driving with a learner's permit?","choices":["A licensed driver 25 or older (such as a parent/guardian or driving instructor)","Any friend will do","No one needs to accompany you"],"explain":"Practice driving with a permit requires a licensed driver age 25 or older (such as a parent/guardian or a certified driving instructor)."},{"id":246,"catKey":"provisional","correct":1,"q":"Roughly how many hours of parent-certified behind-the-wheel practice are generally required for a driver under 18 to get a provisional license?","choices":["A total of 10 hours (including 2 hours at night)","A total of 50 hours (including 10 hours at night)","A total of 100 hours (including 20 hours at night)"],"explain":"Applicants under 18 are generally required to complete a total of 50 hours of behind-the-wheel practice (including 10 hours at night), certified by a parent or guardian."},{"id":247,"catKey":"provisional","correct":1,"q":"For how long after getting a provisional license do the passenger and nighttime driving restrictions apply?","choices":["6 months","12 months","Until you turn 18"],"explain":"The restrictions apply for the first 12 months, but they end sooner if you turn 18 first."},{"id":248,"catKey":"provisional","correct":1,"q":"Which of the following is most likely to be accepted as an exception to the provisional nighttime driving restriction (generally 11:00 p.m. to 5:00 a.m.)?","choices":["Going out to hang out with friends","A valid reason such as work, a school event, or a medical need (including being accompanied by a parent)","No exceptions are ever allowed"],"explain":"Exceptions to the nighttime restriction may be allowed for valid reasons such as work, school events, medical necessity, or being accompanied by a parent."},{"id":249,"catKey":"provisional","correct":0,"q":"What is required of a driver under 18 before getting their first driver's license?","choices":["Completing driver education and driver training","A college-level traffic law course","Nothing in particular is required"],"explain":"A first-time applicant under 18 is required to complete both driver education and driver training."},{"id":250,"catKey":"provisional","correct":1,"q":"What can happen if a driver violates their provisional license restrictions (passengers, nighttime driving, etc.)?","choices":["Nothing happens","The restriction period may be extended, or the parent may be notified and a DMV appearance required","The license is automatically and permanently invalidated"],"explain":"Violating the restrictions can result in an extended restriction period or notification to the parent/guardian."},{"id":251,"catKey":"provisional","correct":1,"q":"For someone getting their first California driver's license at age 18 or older, what does the law say about driver education and driver training?","choices":["It's required just as it is for those under 18","It's not legally required","Completing it results in a fine"],"explain":"First-time applicants 18 or older are not legally required to complete driver education and driver training (though it's recommended)."},{"id":252,"catKey":"provisional","correct":0,"q":"Which of the following can a parent/guardian do regarding the DMV?","choices":["Submit a written request to the DMV to have their child's provisional license revoked","Take the driving test on their child's behalf","They have no authority with the DMV at all"],"explain":"A parent/guardian can submit a written request to the DMV to revoke their minor child's license if they judge it necessary."},{"id":253,"catKey":"provisional","correct":0,"q":"During the first 12 months of a provisional license, whose presence allows you to transport passengers under 20?","choices":["A licensed parent or guardian, a licensed driver 25 or older, or a certified driving instructor","Friends from the same school","There are no exceptions to the restriction"],"explain":"You may transport passengers under 20 only when accompanied by a licensed parent or guardian, a licensed driver 25 or older, or a certified driving instructor."},{"id":254,"catKey":"points","correct":1,"q":"A relatively minor traffic violation, such as running a stop sign, is usually recorded on your driving record as how many points?","choices":["0.5 point","1 point","2 points"],"explain":"Minor violations are typically added to your driving record as 1 point."},{"id":255,"catKey":"points","correct":1,"q":"A serious violation such as DUI or reckless driving is usually recorded on your driving record as how many points?","choices":["1 point","2 points","5 points"],"explain":"Serious violations like DUI or reckless driving are typically recorded as 2 points."},{"id":256,"catKey":"points","correct":1,"q":"An adult driver is treated as a \"negligent operator\" and may be subject to license suspension after accumulating how many points within 12 months?","choices":["2 or more points","4 or more points","8 or more points"],"explain":"Accumulating 4 or more points within 12 months can result in being classified as a negligent operator and facing license suspension."},{"id":257,"catKey":"points","correct":0,"q":"An adult driver may be subject to license suspension after accumulating how many points within 24 months?","choices":["6 or more points","10 or more points","Point count doesn't matter"],"explain":"Accumulating 6 or more points within 24 months can lead to suspension (8 or more within 36 months also applies)."},{"id":258,"catKey":"points","correct":1,"q":"A provisional license holder under 18 may face a DMV hearing or action after accumulating how many points within 12 months?","choices":["1 point","2 points","4 points (same standard as adults)"],"explain":"Provisional license holders under 18 are held to a stricter standard than adults: 2 points within 12 months."},{"id":259,"catKey":"points","correct":1,"q":"What can happen if you fail to appear in court or pay a fine by the deadline after receiving a traffic ticket?","choices":["Nothing in particular happens","Your license may be suspended","The violation is automatically dismissed"],"explain":"Failing to appear or pay a fine can result in additional penalties, including license suspension."},{"id":260,"catKey":"points","correct":1,"q":"If you're in an accident but can't provide proof of the required financial responsibility (such as insurance), what could happen?","choices":["No effect at all","Your license and vehicle registration could be suspended","Only a fine"],"explain":"Being unable to prove financial responsibility can result in suspension of both your license and vehicle registration."},{"id":261,"catKey":"points","correct":1,"q":"What happens if you drive while your license is suspended or revoked?","choices":["You just get a light warning","It's a serious violation that can lead to even harsher penalties","It's not really a problem"],"explain":"Driving while suspended or revoked is a serious offense that can lead to even harsher penalties, including jail time."},{"id":262,"catKey":"dmv","correct":0,"q":"Roughly how long do you have to notify the DMV after a change of address, such as from moving?","choices":["Within 10 days","Within 30 days","Within 1 year"],"explain":"A change of address must generally be reported to the DMV within 10 days."},{"id":263,"catKey":"dmv","correct":0,"q":"If you move to California from another state and become a resident, roughly how long do you have to obtain a California driver's license?","choices":["Within 10 days","Within 90 days","Within 1 year"],"explain":"A new California resident is generally required to obtain a California driver's license within 10 days of becoming a resident."},{"id":264,"catKey":"dmv","correct":1,"q":"Legally speaking, how is a \"hit and run\" — leaving an accident scene without completing required steps like exchanging information or reporting — treated?","choices":["Just treated as a minor traffic violation","A serious crime subject to criminal penalties","Not an issue if it's only property damage"],"explain":"Hit and run is a serious crime, and carries especially severe criminal penalties if anyone was injured."},{"id":265,"catKey":"dmv","correct":0,"q":"What is commonly required when you renew your driver's license?","choices":["A vision test (and possibly a written test again, depending on the situation)","Proof of purchase for a new car","A letter of recommendation from your employer"],"explain":"A vision test is commonly required at renewal, and depending on the circumstances, you may need to retake the written test."},{"id":266,"catKey":"dmv","correct":1,"q":"If you drive without carrying proof of the required financial responsibility (such as auto insurance) and can't produce it at an accident or checkpoint, what could happen?","choices":["It's not really a problem","You could be fined or have your license suspended","You'll only get a warning, with no penalty at all"],"explain":"Being unable to show proof of financial responsibility can result in a fine or license suspension."},{"id":267,"catKey":"dmv","correct":0,"q":"Roughly how long do you have to register a vehicle with the DMV as its new owner after purchasing it?","choices":["Within 10 days","Within 60 days","There's no particular deadline"],"explain":"After purchasing a vehicle, the new owner is generally required to register it with the DMV within 10 days."},{"id":268,"catKey":"highway","correct":0,"q":"Under what basic conditions can you generally use a carpool (HOV) lane?","choices":["When you meet the minimum number of occupants posted on the sign, or your vehicle has an eligible decal","Any time you're in a hurry","There's no restriction — anyone can use it"],"explain":"HOV lanes are limited to vehicles meeting the posted minimum occupancy, or eligible vehicles with a Clean Air decal, etc."},{"id":269,"catKey":"highway","correct":1,"q":"Where can you generally enter or exit a carpool (HOV) lane?","choices":["Anywhere, freely","Only where marked with a broken (dashed) line","Even where marked with a solid line"],"explain":"You must enter and exit an HOV lane only where it's marked with a broken (dashed) line, not a solid line."},{"id":270,"catKey":"highway","correct":1,"q":"If your vehicle breaks down on the freeway and you can no longer drive it under its own power, what should you do first?","choices":["Stop right there in your lane and turn on your hazard lights","Move the vehicle safely to the right shoulder if at all possible","Get out immediately and walk along the opposite side to get help"],"explain":"If you break down, safely move to the right shoulder if you can, and turn on your hazard lights."},{"id":271,"catKey":"highway","correct":1,"q":"What is the correct way to slow down for a freeway exit (off-ramp)?","choices":["Slow down substantially on the main roadway before entering the exit","Enter the exit's deceleration lane, then slow down","Brake hard right before the exit"],"explain":"Braking suddenly on the main roadway risks a rear-end collision, so you should enter the exit's deceleration lane before slowing down."},{"id":272,"catKey":"pedestrians","correct":0,"q":"In California, what is required of the rider and passenger when operating a motorcycle?","choices":["Wearing a helmet","Wearing long sleeves","There's no requirement"],"explain":"California law requires both the motorcycle operator and any passenger to wear a helmet."},{"id":273,"catKey":"pedestrians","correct":1,"q":"Which statement about \"lane splitting\" (a motorcycle riding between lanes of stopped or slow traffic) is correct in California?","choices":["It's always illegal","It's considered legal under certain safe conditions","It's only legal on freeways"],"explain":"California is one of the few states where lane splitting is considered legal under certain safe conditions."},{"id":274,"catKey":"pedestrians","correct":1,"q":"What do you need to legally operate a moped on public roads?","choices":["No license is required at all","A valid driver's license (such as M1/M2)","Just a bicycle helmet — no license needed"],"explain":"Even a moped requires a valid driver's license to operate on public roads."},{"id":275,"catKey":"pedestrians","correct":1,"q":"What is the minimum distance California law requires you to leave when passing a cyclist?","choices":["At least 1 foot","At least 3 feet","No specific distance is required"],"explain":"California law requires you to leave at least 3 feet of space when passing a cyclist."},{"id":276,"catKey":"safety","correct":1,"q":"At what point can a child generally be switched from a rear-facing to a forward-facing car seat?","choices":["Any time after 6 months old","Once they meet the age, weight, and height criteria set by the seat's manufacturer (generally age 2 or older)","Automatically at age 4, regardless of height"],"explain":"The switch depends on meeting the age, weight, and height criteria set by the car seat manufacturer (age 2 or older is one general benchmark)."},{"id":277,"catKey":"safety","correct":0,"q":"Until what point is a child generally required to use a booster seat or other appropriate restraint?","choices":["Until age 8, or until they reach 4 feet 9 inches tall","Until age 5","Until they finish elementary school"],"explain":"Generally, an appropriate child restraint is required until age 8, or until the child reaches 4 feet 9 inches tall."},{"id":278,"catKey":"safety","correct":0,"q":"Which of the following about installing a rear-facing car seat in a front passenger seat with an airbag is correct?","choices":["It's generally prohibited","It's fine to install","It's fine as long as you disable the airbag"],"explain":"Because a deploying airbag can seriously injure a rear-facing car seat's occupant, this is generally prohibited."},{"id":279,"catKey":"signs","correct":0,"q":"What does an octagon-shaped sign mean?","choices":["Stop","Yield","Road work"],"explain":"An octagon-shaped sign always means \"stop,\" regardless of what's written on it.","img":"data:image/gif;base64,R0lGODlhNAAyAMQAAFpaWuXl5TAwMMPDw87OzrS0tLu7uyQkJD09Pe/v79jY2KysrHR0dGlpaUlJSZmZmX5+foyMjEJCQqOjo/X19fj4+DY2Njk5OTc3N/n5+fr6+vv7+/7+/vz8/P39/f///yH5BAAAAAAALAAAAAA0ADIAAAX/YOdVlEhW2SZmXOVmVRdvX/2pX6dxXEZVHorwR6JoNhVOiZPT7D4ZT0cYtdUCAYJiS+hyvZvgz5fJyDbMD0fE40htQdLG0Ggw7A7EYc/v8wEBMhlOgzBPPB5SbG1SFBkfCgIAEwYLA1oBCVgJmpyeAQ0HBDqcLkRmiakdHRsaia0fAXcLBhEMEHcMuhB2d7h3dhMREAQeCRQJLk4oRx2IOho6HR8VEg0BEQcWAgJ73ALb3xji3A4PBwUfPxQqKU4baKvyU8YADRwQBxIWFxfb/QL8CUDAD0O/CwIkHICwAMMEahUSaPABD56HivA8NUCQ w sign generally indicate?","choices":["A prohibition","A general warning or caution","A nearby service facility"],"explain":"Yellow signs generally indicate a warning or caution about conditions ahead.","img":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNDAgMTAwIj4KICA8cG9seWdvbiBwb2ludHM9IjgsMTUgMTMyLDUwIDgsODUiIGZpbGw9IiNGNUQzM0MiIHN0cm9rZT0iIzAwMDAwMCIgc3Ryb2tlLXdpZHRoPSIzIiBzdHJva2UtbGluZWpvaW49InJvdW5kIi8+Cjwvc3ZnPg=="},{"id":284,"catKey":"weather","correct":1,"q":"With your high beams on, within how many feet of an oncoming vehicle must you dim to low beams?","choices":["300 feet","500 feet","1,000 feet"],"explain":"Dim within 500 feet of an oncoming vehicle, and within 300 feet of a vehicle you are following.","src":"DMV Handbook"},{"id":285,"catKey":"dmv","correct":1,"q":"Within how many days must a required SR-1 report be filed with DMV?","choices":["Within 5 days","Within 10 days","Within 30 days"],"explain":"File the SR-1 within 10 days. If you do not, your driving privilege will be suspended.","src":"DMV Handbook"},{"id":286,"catKey":"dmv","correct":0,"q":"If someone is hurt or killed in a collision, how soon must you report it to law enforcement?","choices":["Within 24 hours","Within 72 hours","Within 10 days"],"explain":"Report to law enforcement within 24 hours. This is separate from the SR-1 filed with DMV.","src":"DMV Handbook"},{"id":287,"catKey":"signals","correct":1,"q":"Within how many feet of a railroad crossing is the speed limit 15 mph?","choices":["50 feet","100 feet","500 feet"],"explain":"The limit is 15 mph within 100 feet of a railroad crossing.","src":"DMV Handbook"},{"id":288,"catKey":"defensive","correct":1,"q":"While children are outside, within how many feet of a school is the speed limit 25 mph?","choices":["100 feet","500 feet","1,000 feet"],"explain":"The limit is 25 mph within 500 feet of a school while children are outside or crossing.","src":"DMV Handbook"},{"id":289,"catKey":"weather","correct":2,"q":"How much should you reduce your speed on packed snow?","choices":["No reduction is needed","By 5 to 10 mph","By half"],"explain":"Reduce your speed by half on packed snow. On a wet road, reduce it by 5 to 10 mph.","src":"DMV Handbook"},{"id":290,"catKey":"weather","correct":0,"q":"On ice, what is the most you should drive?","choices":["5 mph","15 mph","25 mph"],"explain":"On ice, reduce your speed to no more than 5 mph.","src":"DMV Handbook"},{"id":291,"catKey":"dmv","correct":1,"q":"What are California's minimum liability insurance amounts (one person / more than one person / property damage)?","choices":["$15,000 / $30,000 / $5,000","$30,000 / $60,000 / $15,000","$100,000 / $300,000 / $50,000"],"explain":"The minimums are $30,000 for one person, $60,000 for more than one person, and $15,000 for property damage.","src":"DMV Handbook"},{"id":292,"catKey":"safety","correct":0,"q":"If a passenger under 16 isn't wearing a seat belt, who can receive a ticket?","choices":["The driver","No one","No one, if they're in the back seat"],"explain":"If a passenger is under 16, the driver can be ticketed.","src":"DMV Handbook"},{"id":293,"catKey":"emergency","correct":2,"q":"What can happen if you fail to stop for a school bus with flashing red lights?","choices":["A warning only","A fine of $100 or less only","A fine of up to $1,000 and a one-year suspension"],"explain":"You may be fined up to $1,000, and your driving privilege could be suspended for one year.","src":"DMV Handbook"},{"id":294,"catKey":"dmv","correct":1,"q":"How long must a minor wait to retake a failed knowledge test, not counting the day of failure?","choices":["No waiting","7 days","30 days"],"explain":"Minors must wait seven days, not including the day of the failure.","src":"DMV Handbook"},{"id":295,"catKey":"dmv","correct":1,"q":"How many attempts do you get at the knowledge test before you must reapply?","choices":["1","3","5"],"explain":"You get three attempts before you must reapply.","src":"DMV Handbook"},{"id":296,"catKey":"emergency","correct":0,"q":"Which is true about traffic fines in a work zone?","choices":["They can be $1,000 or more","They're always the same as elsewhere","There's only a warning, never a fine"],"explain":"Fines for violations in a work zone can be $1,000 or more.","src":"DMV Handbook"},{"id":297,"catKey":"emergency","correct":1,"q":"What can happen if you drive to the scene of a fire or collision to watch?","choices":["Nothing, it's allowed","You can be arrested","Nothing, during the daytime"],"explain":"You can be arrested if you drive to the scene of a fire, collision, or other disaster.","src":"DMV Handbook"}]};

const ic=(n,c="")=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY=864e5,KEY="dmv_v2",PASS=.8,STREAK=3;
const BYID={ja:{},en:{}};DATA.ja.forEach(q=>BYID.ja[q.id]=q);DATA.en.forEach(q=>BYID.en[q.id]=q);
const ALL=DATA.ja.map(q=>q.id);
const COUNT={};CATS.forEach(c=>COUNT[c]=0);DATA.ja.forEach(q=>COUNT[q.catKey]++);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- state ---------- */
function fresh(){return{v:2,lang:"ja",theme:"system",progress:{},bookmarks:[],exams:[],session:null,result:null,cats:CATS.slice(),count:20,smart:true,form:36}}
function load(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s||s.v!==2){
    s=fresh();
    try{
      const l=localStorage.getItem("dmv_quiz_lang_v1");if(l==="en"||l==="ja")s.lang=l;
      const m=JSON.parse(localStorage.getItem("dmv_quiz_marked_v1")||"[]");
      m.forEach(id=>{id=+id;if(BYID.ja[id])s.progress[id]={n:0,c:0,s:0,review:true,due:Date.now()}});
    }catch(e){}
  }
  if(s.session&&!s.session.ids.every(id=>BYID.ja[id]))s.session=null;
  s.cats=(s.cats||[]).filter(c=>CATS.includes(c));
  return s;
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const t=k=>T[S.lang][k];
const Q=id=>BYID[S.lang][id];
const cat=k=>CAT[S.lang][k];

/* ---------- learning model ---------- */
function isDue(p,now){return p&&p.review&&(p.due||0)<=now}
function reviewIds(){return ALL.filter(id=>S.progress[id]&&S.progress[id].review)}
function dueIds(){const n=Date.now();return ALL.filter(id=>isDue(S.progress[id],n))}
function record(id,ok){
  const now=Date.now(),p=S.progress[id]||(S.progress[id]={n:0,c:0,s:0});
  p.n++;p.t=now;p.last=ok?1:0;if(ok)p.c++;
  if(!ok){p.review=true;p.s=0;p.due=now+DAY;return false}
  if(p.review&&(p.due||0)<=now){
    p.s=(p.s||0)+1;
    if(p.s>=STREAK){p.review=false;p.s=0;delete p.due;return true}
    p.due=now+(p.s===1?DAY:3*DAY);
  }
  return false;
}
function makeOrder(id){
  const n=BYID.ja[id].choices.length,idx=[];for(let i=0;i<n;i++)idx.push(i);
  const fixed=i=>/上記|of the above/i.test(BYID.ja[id].choices[i]+" "+BYID.en[id].choices[i]);
  return shuffle(idx.filter(i=>!fixed(i))).concat(idx.filter(fixed));
}
function newSession(mode,ids,extra){
  const orders={};ids.forEach(id=>orders[id]=makeOrder(id));
  S.session=Object.assign({mode,ids,orders,i:0,answers:{},started:Date.now()},extra||{});
  S.result=null;save();
}
function rank(id,now){const p=S.progress[id];if(isDue(p,now))return 0;if(!p||!p.n)return 1;if(p.review||p.last===0)return 2;return p.c/p.n<.8?3:4}
function pick(cats,count,smart){
  const now=Date.now();let pool=ALL.filter(id=>cats.includes(BYID.ja[id].catKey));
  pool=shuffle(pool);
  if(smart)pool=pool.map((id,i)=>[rank(id,now),i,id]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(x=>x[2]);
  return shuffle(pool.slice(0,count));
}
function pickExam(total){
  const sum=ALL.length,quota=CATS.map(c=>({c,x:COUNT[c]*total/sum}));
  quota.forEach(q=>{q.n=Math.max(1,Math.floor(q.x));q.r=q.x-Math.floor(q.x)});
  let left=total-quota.reduce((a,q)=>a+q.n,0);
  quota.slice().sort((a,b)=>b.r-a.r).forEach(q=>{if(left>0&&q.n<COUNT[q.c]){q.n++;left--}});
  const ids=[];quota.forEach(q=>ids.push(...shuffle(ALL.filter(id=>BYID.ja[id].catKey===q.c)).slice(0,q.n)));
  return shuffle(ids);
}
function passCount(n){return Math.ceil(n*PASS)}
function overall(){let n=0,c=0,m=0;ALL.forEach(id=>{const p=S.progress[id];if(p&&p.n){n+=p.n;c+=p.c;if(p.last===1&&!p.review)m++}});return{n,c,m}}
function catStats(){return CATS.map(k=>{let n=0,c=0,a=0;ALL.forEach(id=>{if(BYID.ja[id].catKey!==k)return;const p=S.progress[id];if(p&&p.n){n+=p.n;c+=p.c;a++}});return{k,n,c,a,total:COUNT[k],pct:n?Math.round(c/n*100):null}})}

/* ---------- ui helpers ---------- */
const app=document.getElementById("app"),live=document.getElementById("live");
function say(msg){live.textContent="";setTimeout(()=>live.textContent=msg,30)}
let snackTimer;
function snack(msg){document.querySelectorAll(".snack").forEach(e=>e.remove());const d=document.createElement("div");d.className="snack";d.textContent=msg;document.body.appendChild(d);say(msg);clearTimeout(snackTimer);snackTimer=setTimeout(()=>d.remove(),3500)}
function dialog(title,body,actions,custom){
  const d=document.createElement("dialog");
  d.setAttribute("aria-labelledby","dlgT");
  d.innerHTML=`<h2 id="dlgT">${esc(title)}</h2>${custom||`<p class="body-m muted">${esc(body)}</p>`}<div class="acts">${actions.map((a,i)=>`<button type="button" class="btn st ${a.cls||"text"}" data-i="${i}">${esc(a.label)}</button>`).join("")}</div>`;
  d.addEventListener("click",e=>{
    const b=e.target.closest("[data-i]");
    if(b){d.close();const f=actions[+b.dataset.i].fn;if(f)f();return}
    if(e.target===d)d.close();
    const g=e.target.closest("[data-goto]");
    if(g){d.close();S.session.i=+g.dataset.goto;save();render()}
  });
  d.addEventListener("close",()=>d.remove());
  document.body.appendChild(d);d.showModal();
}
function applyTheme(){
  document.documentElement.dataset.theme=S.theme;document.documentElement.lang=S.lang;document.title=t("app");
  const dark=S.theme==="dark"||(S.theme==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);

}

function topbar(title,opts){

  <button class="lang-btn st" data-act="lang" aria-label="${esc(t("lang"))}">${ic("translate","s18")}${esc(t("langBtn"))}</button>
  ${opts.quiz?"":`<button class="icon-btn st" data-act="theme" aria-label="${esc(t("theme"))}">${ic(themeIcon())}</button>`}</header>`;
}
function nav(cur){
  const due=dueIds().length,items=[["learn","school"],["review","replay"],["exam","exam"],["stats","bars"]];
  return `<nav class="nav">${items.map(([k,i])=>`<button data-go="${k}" ${cur===k?'aria-current="page"':""}><span class="pill st">${ic(i)}${k==="review"&&due?`<span class="badge" aria-label="${due}">${due>99?"99+":due}</span>`:""}</span><span class="lb">${esc(t(k))}</span></button>`).join("")}</nav>`;
}

const stripe=(a,b)=>`<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${b}" aria-valuenow="${a}"><i style="width:${b?a/b*100:0}%"></i></div>`;

    <button class="tile st" data-go="exam" style="border:0;text-align:left;color:inherit"><div class="v">${last?Math.round(last.correct/last.total*100)+"<small>%</small>":t("none")}</div><div class="k">${esc(t("lastExam"))}</div></button>

  <section class="section"><div class="row between"><h2 class="title-m">${esc(t("categories"))}</h2><button class="btn text st" data-act="toggleCats">${esc(S.cats.length===CATS.length?t("clear"):t("all"))}</button></div><div class="chips">${chips}</div></section>

  <footer class="note">${t("foot")}</footer></main>
  <button class="fab st" data-act="startLearn" ${S.cats.length?"":"disabled"}>${S.cats.length?ic("play"):""}${esc(S.cats.length?t("start"):t("pickCat"))}</button>`+nav("learn");
}
function vReview(){
  const due=dueIds(),q=reviewIds(),now=Date.now(),bm=S.bookmarks.filter(id=>BYID.ja[id]);
  const rows=q.slice().sort((a,b)=>(S.progress[a].due||0)-(S.progress[b].due||0)).map(id=>{
    const p=S.progress[id],d=Math.ceil(((p.due||0)-now)/DAY);
    return `<div class="list-item"><div class="grow"><div class="body-m">${esc(Q(id).q)}</div><div class="label-m muted" style="margin-top:4px"><span class="dots" aria-hidden="true">${[0,1,2].map(i=>`<i class="${i<(p.s||0)?"on":""}"></i>`).join("")}</span> &nbsp;${esc(d<=0?t("nextToday"):t("nextIn")(d))}</div></div><button class="icon-btn st" data-act="unreview" data-id="${id}" aria-label="${esc(t("remove"))}">${ic("close")}</button></div>`}).join("");
  const bms=bm.map(id=>`<div class="list-item"><div class="grow body-m">${esc(Q(id).q)}</div><button class="icon-btn st on" data-act="unbm" data-id="${id}" aria-label="${esc(t("bookmarkDel"))}">${ic("bm")}</button></div>`).join("");
  return topbar(t("review"))+`<main class="main" id="main">

let showAlt=false;
function vQuiz(){
  const s=S.session,id=s.ids[s.i],q=Q(id),exam=s.mode==="exam",ans=s.answers[id],done=ans!==undefined,reveal=done&&!exam;
  const marked=S.bookmarks.includes(id),order=s.orders[id];
  const choices=order.map((orig,pos)=>{
    let cls="";
    if(exam&&ans===orig)cls="sel";
    if(reveal){if(orig===q.correct)cls="ok";else if(orig===ans)cls="ng";else cls="fade"}
    const mark=reveal&&orig===q.correct?ic("check"):reveal&&orig===ans?ic("close"):"";
    const flag=reveal&&orig===q.correct?`<span style="position:absolute;width:1px;height:1px;overflow:hidden">${esc(t("correct"))}: </span>`:"";
    return `<button class="choice st ${cls}" data-act="answer" data-o="${orig}" ${reveal?"disabled":""} ${exam?`aria-pressed="${ans===orig}"`:""}><span class="key">${pos+1}</span><span class="tx">${flag}${esc(q.choices[orig])}</span>${mark}</button>`}).join("");
  let fb="";
  if(reveal){
    const ok=ans===q.correct;
    const a=BYID[otherLang()][id];
    fb=`<section class="feedback ${ok?"ok":"ng"}" id="fb"><div class="hd">${ic(ok?"ok":"cancel")}<span>${esc(ok?t("correct"):t("incorrect"))}</span></div>${ok?"":`<div class="title-s" style="margin-bottom:4px">${esc(t("answerIs")(q.choices[q.correct]))}</div>`}<div class="body-m">${esc(q.explain)}</div></section>
    <div style="margin-top:8px"><button class="btn text st" data-act="alt" aria-expanded="${showAlt}">${esc(showAlt?t("hideAlt"):t("showAlt"))}</button></div>
    ${showAlt?`<div class="alt" lang="${otherLang()}"><div class="title-s">${esc(a.q)}</div><div style="margin-top:4px">${esc(a.choices[a.correct])}</div><div class="muted" style="margin-top:4px">${esc(a.explain)}</div></div>`:""}`;
  }
  const isLast=s.i===s.ids.length-1;
  const actions=exam?`<button class="btn outlined st" data-act="prev" ${s.i===0?"disabled":""}>${esc(t("prev"))}</button><button class="icon-btn st" data-act="palette" aria-label="${esc(t("palette"))}">${ic("grid")}</button><span class="grow"></span>${isLast?`<button class="btn filled st" data-act="submit">${esc(t("submit"))}</button>`:`<button class="btn filled st" data-act="nextQ">${esc(t("nextPlain"))}</button>`}`
    :reveal?`<button class="btn filled st grow has-i" id="nextBtn" data-act="nextQ">${esc(isLast?t("seeResult"):t("next"))}${ic("forward","s18")}</button>`:"";
  const prog=exam?answeredN(s):s.i+(done?1:0);
  return topbar(t("q")(s.i+1,s.ids.length),{quiz:true,left:`<button class="icon-btn st" data-act="quit" aria-label="${esc(t("quit"))}">${ic("close")}</button>`,right:`<button class="icon-btn st ${marked?"on":""}" data-act="bm" data-id="${id}" aria-pressed="${marked}" aria-label="${esc(marked?t("bookmarkDel"):t("bookmarkAdd"))}">${ic(marked?"bm":"bmo")}</button>`})+
  `<main class="main quiz" id="main"><div class="q-progress">${stripe(prog,s.ids.length)}</div>
  <div class="q-meta"><span class="tag">${esc(cat(q.catKey))}</span>${q.src?`<span class="label-m muted" style="font-weight:400">${esc(t("source")(q.src))}</span>`:""}</div>
  ${q.img?`<div class="sign"><img src="${esc(q.img)}" alt=""></div>`:""}
  <h2 class="q-text" id="qText" tabindex="-1">${esc(q.q)}</h2>
  <div class="choices" role="group" aria-labelledby="qText">${choices}</div>${fb}
  <p class="kbd-hint">${esc(t("kbd"))}</p></main>
  ${actions?`<div class="bottom-actions"><div>${actions}</div></div>`:""}`;
}
function vResult(){
  const r=S.result,ids=r.ids,correct=ids.filter(id=>r.answers[id]===BYID.ja[id].correct).length,pct=Math.round(correct/ids.length*100),ok=correct>=passCount(ids.length);
  const wrong=ids.filter(id=>r.answers[id]!==BYID.ja[id].correct);
  const items=wrong.map(id=>{const q=Q(id),a=r.answers[id];return `<article class="card low"><span class="tag">${esc(cat(q.catKey))}</span>${q.img?`<div class="sign" style="margin-top:8px"><img src="${esc(q.img)}" alt=""></div>`:""}<p class="title-s" style="margin-top:8px">${esc(q.q)}</p>
  <div class="ans ng">${ic("close","s18")}<span>${esc(t("yourAns"))}: ${esc(a===undefined?t("noAns"):q.choices[a])}</span></div><div class="ans ok">${ic("check","s18")}<span>${esc(q.choices[q.correct])}</span></div><p class="body-m muted" style="margin-top:8px">${esc(q.explain)}</p></article>`}).join("");
  const byCat=CATS.map(k=>{const my=ids.filter(id=>BYID.ja[id].catKey===k);if(!my.length)return"";const c=my.filter(id=>r.answers[id]===BYID.ja[id].correct).length;return{k,c,n:my.length}}).filter(Boolean).sort((a,b)=>a.c/a.n-b.c/b.n);
  const cats=r.mode==="exam"?`<section class="section"><h2>${esc(t("byCat"))}</h2><div class="list">${byCat.map(x=>`<div class="bar-row"><div class="row between"><span class="title-s grow">${esc(cat(x.k))}</span><span class="title-s">${x.c} / ${x.n}</span></div><div class="bar-track"><i style="width:${x.c/x.n*100}%"></i></div></div>`).join("")}</div></section>`:"";
  return topbar(t("resultTitle"),{left:""})+`<main class="main" id="main">
  <section class="card low result-head"><div class="score" tabindex="-1" id="scoreEl">${correct}<span class="headline-s muted"> / ${ids.length}</span></div><div class="title-m">${esc(t("resultPct")(pct))}</div>
  ${r.mode==="exam"?`<div class="status ${ok?"ok":"ng"}">${ic(ok?"ok":"cancel","s18")}${esc(ok?t("passed"):t("failed"))}</div>`:""}<div class="label-m muted" style="margin-top:8px;font-weight:400">${esc(t("passLine"))}</div>
  <div style="display:flex;flex-direction:column;gap:8px;margin-top:24px">
  ${wrong.length?`<button class="btn filled st" data-act="retryMissed">${esc(t("retryMissed"))}</button>`:""}
  <button class="btn ${wrong.length?"tonal":"filled"} st" data-act="retrySame">${esc(t("retrySame"))}</button><button class="btn text st" data-go="learn">${esc(t("toHome"))}</button></div></section>
  ${cats}<section class="section"><h2>${esc(t("missed")(wrong.length))}</h2>${wrong.length?items:`<div class="empty body-m">${esc(t("allRight"))}</div>`}</section></main>`+nav("");
}
let listQ="";
function listHtml(){
  const k=listQ.trim().toLowerCase();
  const items=ALL.filter(id=>{if(!k)return true;return [BYID.ja[id],BYID.en[id]].some(q=>(q.q+" "+q.choices.join(" ")+" "+q.explain).toLowerCase().includes(k))});
  const rows=items.map(id=>{const q=Q(id),m=S.bookmarks.includes(id);return `<details class="qa"><summary class="body-m"><span class="grow">${esc(q.q)}</span></summary><div class="bd"><span class="tag">${esc(cat(q.catKey))}</span>${q.img?`<div class="sign" style="margin-top:8px"><img loading="lazy" src="${esc(q.img)}" alt=""></div>`:""}${q.choices.map((c,i)=>`<div class="ans ${i===q.correct?"ok":""}">${i===q.correct?ic("check","s18"):'<span style="width:18px;flex:none"></span>'}<span class="${i===q.correct?"title-s":"muted"}">${esc(c)}</span></div>`).join("")}<p class="body-m muted" style="margin-top:8px">${esc(q.explain)}</p><button class="btn text st has-i" style="margin:8px 0 0 -12px" data-act="bm" data-id="${id}">${ic(m?"bm":"bmo","s18")}${esc(m?t("bookmarkDel"):t("bookmarkAdd"))}</button></div></details>`}).join("");
  return `<p class="label-m muted" style="margin:12px 4px 0">${esc(t("hits")(items.length))}</p>${items.length?`<div class="list">${rows}</div>`:`<div class="empty">${esc(t("noHits"))}</div>`}`;
}
function vList(){
  return topbar(t("listTitle"),{quiz:true,left:`<button class="icon-btn st" data-go="learn" aria-label="${esc(t("back"))}">${ic("backA")}</button>`})+`<main class="main" id="main"><label class="search">${ic("search")}<input id="searchI" type="search" value="${esc(listQ)}" placeholder="${esc(t("searchPh"))}" aria-label="${esc(t("searchPh"))}" autocomplete="off"></label><div id="listBox">${listHtml()}</div></main>`;
}

/* ---------- router ---------- */
function route(){const r=location.hash.replace(/^#\/?/,"");return ["learn","review","exam","stats","quiz","result","list"].includes(r)?r:"learn"}
function go(r){if(route()===r&&location.hash)render();else location.hash="#/"+r}
let lastRoute="";
function render(){
  let r=route();
  if(r==="quiz"&&!S.session)r="learn";
  if(r==="result"&&!S.result)r="learn";
  applyTheme();
  const views={learn:vLearn,review:vReview,exam:vExam,stats:vStats,quiz:vQuiz,result:vResult,list:vList};
  const y=window.scrollY,same=lastRoute===r&&r!=="quiz"&&r!=="result";
  app.innerHTML=views[r]();
  if(!same)window.scrollTo(0,0);else window.scrollTo(0,y);
  lastRoute=r;
  onScroll();
}
function onScroll(){const b=document.getElementById("topbar");if(b)b.classList.toggle("scrolled",window.scrollY>4)}

/* ---------- quiz actions ---------- */
function afterQuestionRender(focusFb){
  const q=document.getElementById("qText");
  if(focusFb){const n=document.getElementById("nextBtn"),f=document.getElementById("fb");if(f)f.scrollIntoView({block:"nearest",behavior:"smooth"});if(n)n.focus({preventScroll:true})}
  else if(q)q.focus({preventScroll:true});
}
function answer(orig){
  const s=S.session,id=s.ids[s.i],exam=s.mode==="exam";
  if(!exam&&s.answers[id]!==undefined)return;
  s.answers[id]=orig;
  if(!exam){
    const ok=orig===BYID.ja[id].correct,over=record(id,ok);
    save();render();afterQuestionRender(true);
    say((ok?t("correct"):t("incorrect"))+". "+Q(id).explain);
    if(over)snack(t("overcome"));
  }else{save();render();}
}
function finish(){
  const s=S.session;
  if(s.mode==="exam"){
    s.ids.forEach(id=>{if(s.answers[id]!==undefined)record(id,s.answers[id]===BYID.ja[id].correct);else record(id,false)});
    S.exams.push({t:Date.now(),total:s.ids.length,correct:s.ids.filter(id=>s.answers[id]===BYID.ja[id].correct).length});
    if(S.exams.length>50)S.exams=S.exams.slice(-50);
  }
  S.result={mode:s.mode,ids:s.ids,answers:s.answers};S.session=null;save();go("result");
}
function nextQ(){const s=S.session;showAlt=false;if(s.i<s.ids.length-1){s.i++;save();render();afterQuestionRender()}else if(s.mode==="exam")askSubmit();else finish()}
function prevQ(){const s=S.session;if(s.i>0){s.i--;save();render();afterQuestionRender()}}
function askSubmit(){const s=S.session,left=s.ids.length-answeredN(s);dialog(t("submitTitle"),t("submitBody")(left),[{label:t("goOn")},{label:t("submitOk"),cls:"filled",fn:finish}])}
function guard(fn){const s=S.session;if(s&&answeredN(s)>0)dialog(t("replaceTitle"),t("replaceBody"),[{label:t("cancel")},{label:t("replaceOk"),cls:"filled",fn}]);else fn()}
function begin(mode,ids,extra){newSession(mode,ids,extra);showAlt=false;go("quiz")}

const ACT={
  lang(){S.lang=otherLang();save();render();},
  theme(){const seq=["system","light","dark"];S.theme=seq[(seq.indexOf(S.theme)+1)%3];save();render();snack(t({system:"themeSystem",light:"themeLight",dark:"themeDark"}[S.theme]))},
  cat(b){const c=b.dataset.c;S.cats=S.cats.includes(c)?S.cats.filter(x=>x!==c):CATS.filter(x=>S.cats.includes(x)||x===c);save();render()},
  toggleCats(){S.cats=S.cats.length===CATS.length?[]:CATS.slice();save();render()},
  count(b){S.count=+b.dataset.n;save();render()},
  smart(){S.smart=!S.smart;save();render()},
  resume(){go("quiz")},
  startLearn(){guard(()=>{const pool=ALL.filter(id=>S.cats.includes(BYID.ja[id].catKey)).length,n=S.count&&S.count<pool?S.count:pool;begin("practice",pick(S.cats,n,S.smart))})},
  practiceCat(b){guard(()=>begin("practice",pick([b.dataset.c],Math.min(20,COUNT[b.dataset.c]),true)))},
  startReview(){guard(()=>begin("review",shuffle(dueIds())))},
  earlyReview(){guard(()=>begin("review",shuffle(reviewIds())))},
  startBm(){guard(()=>begin("practice",shuffle(S.bookmarks.filter(id=>BYID.ja[id]))))},
  unreview(b){const p=S.progress[b.dataset.id];if(p){p.review=false;p.s=0;delete p.due;save();render()}},
  unbm(b){S.bookmarks=S.bookmarks.filter(i=>i!==+b.dataset.id);save();render()},
  bm(b){const id=+b.dataset.id;S.bookmarks=S.bookmarks.includes(id)?S.bookmarks.filter(i=>i!==id):S.bookmarks.concat(id);save();
    if(route()==="list")b.innerHTML=ic(S.bookmarks.includes(id)?"bm":"bmo","s18")+esc(S.bookmarks.includes(id)?t("bookmarkDel"):t("bookmarkAdd"));else render()},
  form(b){S.form=+b.dataset.n;save();render()},
  startExam(){guard(()=>begin("exam",pickExam(S.form)))},
  answer(b){answer(+b.dataset.o)},
  nextQ,prev:prevQ,submit:askSubmit,
  alt(){showAlt=!showAlt;render()},
  palette(){const s=S.session;dialog(t("palette"),"",[{label:t("close")}],`<div class="grid-nav">${s.ids.map((id,i)=>`<button type="button" class="st ${s.answers[id]!==undefined?"done":""} ${i===s.i?"cur":""}" data-goto="${i}" aria-label="${i+1}">${i+1}</button>`).join("")}</div>`)},
  quit(){dialog(t("quitTitle"),t("quitBody"),[{label:t("keep")},{label:t("quit"),cls:"filled",fn:()=>go("learn")}])},
  retryMissed(){const r=S.result,w=r.ids.filter(id=>r.answers[id]!==BYID.ja[id].correct);begin("retry",shuffle(w))},
  retrySame(){const r=S.result;begin(r.mode==="exam"?"exam":"retry",shuffle(r.ids))},
  reset(){dialog(t("resetTitle"),t("resetBody"),[{label:t("cancel")},{label:t("erase"),cls:"filled",fn(){const l=S.lang,th=S.theme;S=fresh();S.lang=l;S.theme=th;try{localStorage.removeItem("dmv_quiz_marked_v1")}catch(e){}save();render();snack(t("erased"))}}])}
};
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const f=ACT[b.dataset.act];if(f)f(b);
});
document.addEventListener("pointerdown",e=>{
  const el=e.target.closest(".st");if(!el||el.disabled)return;
  const r=el.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,x=document.createElement("span");
  x.className="rip";x.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  el.appendChild(x);x.addEventListener("animationend",()=>x.remove());
});
document.addEventListener("input",e=>{if(e.target.id==="searchI"){listQ=e.target.value;document.getElementById("listBox").innerHTML=listHtml()}});
document.addEventListener("keydown",e=>{
  if(route()!=="quiz"||!S.session||document.querySelector("dialog[open]")||e.metaKey||e.ctrlKey||e.altKey)return;
  const s=S.session,id=s.ids[s.i],o=s.orders[id];
  if(/^[1-4]$/.test(e.key)&&o[+e.key-1]!==undefined){if(s.mode==="exam"||s.answers[id]===undefined){e.preventDefault();answer(o[+e.key-1])}}
  else if(e.key.toLowerCase()==="b")ACT.bm({dataset:{id}});
  else if(e.key==="Enter"&&s.mode!=="exam"&&s.answers[id]!==undefined&&!(e.target.closest&&e.target.closest("button:not(#nextBtn)"))){e.preventDefault();nextQ()}
  else if(s.mode==="exam"&&e.key==="ArrowRight"&&s.i<s.ids.length-1)nextQ();
  else if(s.mode==="exam"&&e.key==="ArrowLeft")prevQ();
});
window.addEventListener("hashchange",render);
window.addEventListener("scroll",onScroll,{passive:true});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
window.addEventListener("storage",e=>{if(e.key===KEY){S=load();render()}});
render();
if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
