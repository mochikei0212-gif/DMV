<!DOCTYPE html>
<html lang="ja" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DMV対策</title>
<meta name="description" content="カリフォルニア州DMV筆記試験の非公式練習アプリ（日本語・英語）">
<meta name="theme-color" content="#F6FBF3" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/mochikei0212-gif/DMV/main/IMG_3974.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DMV対策">
<style>
:root{
  --primary:#2B6A46;--on-primary:#fff;--primary-container:#B1F1C4;--on-primary-container:#00210F;
  --secondary:#4F6354;--on-secondary:#fff;--secondary-container:#D2E8D5;--on-secondary-container:#0D1F14;
  --tertiary:#3B6470;--tertiary-container:#BFE9F7;--on-tertiary-container:#001F27;
  --error:#BA1A1A;--on-error:#fff;--error-container:#FFDAD6;--on-error-container:#410002;
  --surface:#F6FBF3;--on-surface:#181D19;--on-surface-variant:#414941;--outline:#717971;--outline-variant:#C1C9BF;
  --sc-low:#F0F5EE;--sc:#EBEFE8;--sc-high:#E5EAE2;--sc-highest:#DFE4DD;--inverse-surface:#2D322D;--inverse-on-surface:#EEF2EB;--inverse-primary:#95D5A9;
  --ease:cubic-bezier(.2,0,0,1);--shadow:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);
  --shadow-3:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);
}
@media (prefers-color-scheme:dark){:root[data-theme="system"]{
  --primary:#95D5A9;--on-primary:#00391F;--primary-container:#0D5130;--on-primary-container:#B1F1C4;
  --secondary:#B6CCBA;--on-secondary:#223528;--secondary-container:#384B3E;--on-secondary-container:#D2E8D5;
  --tertiary:#A3CDDB;--tertiary-container:#224C58;--on-tertiary-container:#BFE9F7;
  --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
  --surface:#101510;--on-surface:#DFE4DD;--on-surface-variant:#C1C9BF;--outline:#8B9389;--outline-variant:#414941;
  --sc-low:#181D19;--sc:#1C211D;--sc-high:#262B27;--sc-highest:#313630;--inverse-surface:#DFE4DD;--inverse-on-surface:#2D322D;--inverse-primary:#2B6A46;
}}
:root[data-theme="dark"]{
  --primary:#95D5A9;--on-primary:#00391F;--primary-container:#0D5130;--on-primary-container:#B1F1C4;
  --secondary:#B6CCBA;--on-secondary:#223528;--secondary-container:#384B3E;--on-secondary-container:#D2E8D5;
  --tertiary:#A3CDDB;--tertiary-container:#224C58;--on-tertiary-container:#BFE9F7;
  --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
  --surface:#101510;--on-surface:#DFE4DD;--on-surface-variant:#C1C9BF;--outline:#8B9389;--outline-variant:#414941;
  --sc-low:#181D19;--sc:#1C211D;--sc-high:#262B27;--sc-highest:#313630;--inverse-surface:#DFE4DD;--inverse-on-surface:#2D322D;--inverse-primary:#2B6A46;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface);color:var(--on-surface);font:400 16px/24px Roboto,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit}
a{color:var(--primary)}
svg.i{width:24px;height:24px;fill:currentColor;flex:none;display:block}
svg.i.s18{width:18px;height:18px}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.headline-m{font-size:28px;line-height:36px;font-weight:400}
.headline-s{font-size:24px;line-height:32px;font-weight:400}
.title-l{font-size:22px;line-height:28px;font-weight:400}
.title-m{font-size:16px;line-height:24px;font-weight:500}
.title-s{font-size:14px;line-height:20px;font-weight:500}
.body-m{font-size:14px;line-height:20px}
.label-m{font-size:12px;line-height:16px;font-weight:500}
.muted{color:var(--on-surface-variant)}

/* state layer + ripple */
.st{position:relative;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none}
.st::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s linear;pointer-events:none}
@media (hover:hover){.st:hover::before{opacity:.08}}
.st:focus-visible::before,.st:active::before{opacity:.12}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);animation:rip .45s var(--ease) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* layout */
.app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;min-height:64px;padding:max(8px,env(safe-area-inset-top)) 4px 8px 16px;background:var(--surface);transition:background .2s linear}
.topbar.scrolled{background:var(--sc)}
.topbar h1{flex:1;min-width:0;font-size:22px;line-height:28px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar.quiz{padding-left:4px}
.main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:4px 16px calc(112px + env(safe-area-inset-bottom))}
.main:has(~ .fab){padding-bottom:calc(184px + env(safe-area-inset-bottom))}
body:has(.fab) .snack{bottom:calc(168px + env(safe-area-inset-bottom))}
.main.quiz{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--sc);padding:12px 0 calc(16px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--on-surface-variant);cursor:pointer;min-width:0}
.nav .pill{position:relative;width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:background .2s var(--ease)}
.nav .lb{font-size:12px;line-height:16px;font-weight:500}
.nav button[aria-current="page"]{color:var(--on-surface)}
.nav button[aria-current="page"] .pill{background:var(--secondary-container);color:var(--on-secondary-container)}
.nav .badge{position:absolute;top:0;left:50%;margin-left:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--error);color:var(--on-error);font-size:11px;line-height:16px;font-weight:500;text-align:center}
@media (min-width:840px){
  .nav{top:0;right:auto;bottom:0;width:80px;flex-direction:column;justify-content:flex-start;gap:12px;padding:44px 0 16px}
  .nav button{flex:none;height:56px}.nav .pill{width:56px}
  .app:has(.nav){padding-left:80px}
  .fab{right:24px;bottom:24px}
}

/* components */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 24px;border:0;border-radius:20px;font-size:14px;line-height:20px;font-weight:500;letter-spacing:.01em;text-align:center}
.btn.has-i{padding-left:16px}
.btn.lg{min-height:56px;border-radius:28px;font-size:16px;line-height:24px;width:100%}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.outlined{background:none;border:1px solid var(--outline);color:var(--primary)}
.btn.text{background:none;color:var(--primary);padding:0 12px}
.btn.danger{background:none;color:var(--error);padding:0 12px}
.btn[disabled]{background:color-mix(in srgb,var(--on-surface) 12%,transparent);color:color-mix(in srgb,var(--on-surface) 38%,transparent);cursor:default;pointer-events:none}
.icon-btn{width:48px;height:48px;border:0;border-radius:50%;background:none;color:var(--on-surface-variant);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn.on{color:var(--primary)}
.lang-btn{height:40px;padding:0 12px 0 8px;border:0;background:none;border-radius:20px;display:inline-flex;align-items:center;gap:4px;color:var(--on-surface-variant);font-size:14px;font-weight:500;flex:none}
.fab{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:5;display:inline-flex;align-items:center;gap:12px;min-height:56px;padding:0 20px 0 16px;border:0;border-radius:16px;background:var(--primary-container);color:var(--on-primary-container);font-size:14px;line-height:20px;font-weight:500;box-shadow:var(--shadow-3)}
.fab[disabled]{background:var(--sc-high);color:var(--on-surface-variant);box-shadow:var(--shadow);cursor:default;padding:0 20px}
.card{border-radius:12px;padding:16px;margin-top:12px}
.card.filled{background:var(--sc-highest)}
.card.low{background:var(--sc-low)}
.card.elevated{background:var(--sc-low);box-shadow:var(--shadow)}
.card.outlined{border:1px solid var(--outline-variant)}
.card.primary{background:var(--primary-container);color:var(--on-primary-container)}
.card.error{background:var(--error-container);color:var(--on-error-container)}
.card.tertiary{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.section{margin-top:24px}
.section>h2{font-size:16px;line-height:24px;font-weight:500;margin-bottom:4px}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 16px;border:1px solid var(--outline);border-radius:8px;background:none;color:var(--on-surface-variant);font-size:14px;line-height:20px;font-weight:500;text-align:left}
.chip .ck{display:none}
.chip[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent;padding-left:8px}
.chip[aria-pressed="true"] .ck{display:block}
.chip .n{font-weight:400;opacity:.75}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{background:var(--sc-low);border-radius:12px;padding:12px 16px;min-width:0}
.tile .v{font-size:28px;line-height:36px;font-weight:400}
.tile .v small{font-size:14px;color:var(--on-surface-variant)}
.tile .k{font-size:12px;line-height:16px;font-weight:500;color:var(--on-surface-variant)}
.progress{height:4px;border-radius:2px;background:var(--secondary-container);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:2px;background:var(--primary);transition:width .3s var(--ease)}
.switch-row{display:flex;align-items:center;gap:16px;padding:12px 0;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.switch{position:relative;width:52px;height:32px;border-radius:16px;background:var(--sc-highest);border:2px solid var(--outline);flex:none;transition:background .2s var(--ease)}
.switch::after{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transition:all .2s var(--ease)}
[aria-checked="true"] .switch{background:var(--primary);border-color:var(--primary)}
[aria-checked="true"] .switch::after{left:22px;top:2px;width:24px;height:24px;background:var(--on-primary)}

/* quiz */
.q-progress{position:sticky;top:64px;z-index:4;background:var(--surface);padding-bottom:8px}
.q-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px}
.tag{display:inline-flex;align-items:center;min-height:24px;padding:2px 8px;border-radius:6px;background:var(--secondary-container);color:var(--on-secondary-container);font-size:12px;line-height:16px;font-weight:500}
.q-text{font-size:20px;line-height:30px;font-weight:400;margin-top:12px}
.sign{display:flex;justify-content:center;margin-top:16px;padding:16px;border-radius:12px;background:#fff}
.sign img{display:block;height:120px;width:auto;max-width:100%;object-fit:contain}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 16px;border:1px solid var(--outline-variant);border-radius:12px;background:var(--sc-low);text-align:left;font-size:16px;line-height:24px;color:var(--on-surface)}
.choice .key{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--sc-highest);color:var(--on-surface-variant);font-size:13px;font-weight:500}
.choice .tx{flex:1;min-width:0}
.choice.sel{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
.choice.sel .key{background:var(--secondary);color:var(--on-secondary)}
.choice.ok{background:var(--primary-container);color:var(--on-primary-container);border-color:transparent}
.choice.ok .key{background:var(--primary);color:var(--on-primary)}
.choice.ng{background:var(--error-container);color:var(--on-error-container);border-color:transparent}
.choice.ng .key{background:var(--error);color:var(--on-error)}
.choice.fade{opacity:.62}
.choice[disabled]{cursor:default;pointer-events:none}
.feedback{margin-top:16px;border-radius:12px;padding:16px;animation:rise .25s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.feedback.ok{background:var(--primary-container);color:var(--on-primary-container)}
.feedback.ng{background:var(--error-container);color:var(--on-error-container)}
.feedback .hd{display:flex;align-items:center;gap:8px;font-weight:500;margin-bottom:4px}
.alt{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--sc);font-size:14px;line-height:20px}
.bottom-actions{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sc);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bottom-actions>div{max-width:688px;margin:0 auto;display:flex;align-items:center;gap:8px}
.bottom-actions .btn{min-height:48px;border-radius:24px}
.kbd-hint{display:none;margin-top:12px;font-size:12px;line-height:16px;color:var(--on-surface-variant)}
@media (hover:hover) and (min-width:840px){.kbd-hint{display:block}}

/* lists */
.list{margin-top:8px;border-radius:12px;overflow:hidden;background:var(--sc-low)}
.list-item{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 16px;border:0;background:none;text-align:left;border-top:1px solid var(--outline-variant);color:var(--on-surface)}
.list-item:first-child{border-top:0}
.list-item .icon-btn{margin-right:-12px}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--outline-variant)}
.dots i.on{background:var(--primary)}
.bar-row{display:block;width:100%;padding:10px 16px;border:0;background:none;text-align:left;border-top:1px solid var(--outline-variant);color:var(--on-surface)}
.bar-row:first-child{border-top:0}
.bar-track{height:8px;border-radius:4px;background:var(--sc-highest);margin-top:6px;overflow:hidden}
.bar-track>i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--primary)}
.search{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-radius:28px;background:var(--sc-high);color:var(--on-surface-variant)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;color:var(--on-surface);font-size:16px}
details.qa{border-top:1px solid var(--outline-variant)}
details.qa:first-child{border-top:0}
details.qa summary{list-style:none;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
details.qa summary::-webkit-details-marker{display:none}
details.qa .bd{padding:0 16px 16px}
.score{font-size:57px;line-height:64px;font-weight:400}
.result-head{text-align:center;padding:24px 16px}
.status{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 16px 4px 8px;border-radius:8px;font-size:14px;font-weight:500;margin-top:8px}
.status.ok{background:var(--primary);color:var(--on-primary)}
.status.ng{background:var(--error);color:var(--on-error)}
.ans{display:flex;gap:8px;margin-top:6px;font-size:14px;line-height:20px}
.ans svg{margin-top:1px}
.ans.ok svg{color:var(--primary)}.ans.ng svg{color:var(--error)}
.grid-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.grid-nav button{height:44px;border-radius:12px;border:1px solid var(--outline-variant);background:none;color:var(--on-surface)}
.grid-nav button.done{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
.grid-nav button.cur{outline:2px solid var(--primary)}
.note{margin-top:32px;font-size:12px;line-height:18px;color:var(--on-surface-variant)}
.empty{padding:24px 16px;text-align:center;color:var(--on-surface-variant)}

dialog{border:0;border-radius:28px;background:var(--sc-high);color:var(--on-surface);padding:24px;width:min(560px,calc(100vw - 48px));max-height:calc(100dvh - 48px);box-shadow:var(--shadow-3)}
dialog::backdrop{background:rgba(0,0,0,.32)}
dialog h2{font-size:24px;line-height:32px;font-weight:400;margin-bottom:16px}
dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:24px;flex-wrap:wrap}
.snack{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:20;max-width:480px;margin:0 auto;padding:14px 16px;border-radius:4px;background:var(--inverse-surface);color:var(--inverse-on-surface);font-size:14px;line-height:20px;box-shadow:var(--shadow-3);animation:rise .2s var(--ease)}
@media print{.nav,.bottom-actions,.topbar button{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="live" class="snack-live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
<script>

通・歩行者の安全を確認した上で赤信号での右折が認められています。"},{"id":9,"catKey":"parking","correct":0,"q":"縁石が「赤色」に塗られている場所での駐停車について正しいのはどれですか？","choices":["常に駐停車が禁止されている","15分以内なら駐車できる","荷物の積み下ろしのみ可能","障害者用駐車スペースである"],"explain":"赤い縁石は常に駐停車禁止のゾーンを示します。"},{"id":10,"catKey":"parking","correct":2,"q":"縁石が「黄色」に塗られている場所は主に何のために使われますか？","choices":["障害者用の駐車","旅客の乗り降り専用","貨物の積み下ろし","消防車専用スペース"],"explain":"黄色い縁石は主に貨物の積み下ろしのための短時間駐車を示します。"},{"id":11,"catKey":"parking","correct":2,"q":"消火栓（ファイヤーハイドラント）からどのくらいの距離内に駐車してはいけませんか？","choices":["5フィート","10フィート","15フィート","25フィート"],"explain":"消火栓から15フィート以内の駐車は、緊急時の消防活動を妨げるため禁止されています。"},{"id":12,"catKey":"weather","correct":1,"q":"ワイパーを作動させるほどの雨天時にカリフォルニア州の法律で義務付けられているのはどれですか？","choices":["ハザードランプの点灯","ヘッドライトの点灯","徐行運転のみ","特に規定はない"],"explain":"視界不良で前方のワイパーを使用する必要がある天候のときは、ヘッドライトを点灯することが法律で義務付けられています。"},{"id":13,"catKey":"defensive","correct":1,"q":"運転中の携帯電話の使用について、カリフォルニア州の法律で正しいのはどれですか？","choices":["手で持って通話するのは合法である","ハンズフリーであれば基本的に許可される","停車中以外は一切使用できない","18歳以上であれば制限はない"],"explain":"運転中に携帯電話を手で持って通話・操作することは禁止されており、ハンズフリー機能の使用のみ基本的に認められています。"},{"id":14,"catKey":"pedestrians","correct":0,"q":"横断歩道を渡っている歩行者がいる場合、運転者が取るべき行動はどれですか？","choices":["歩行者が渡り終えるまで一時停止し道を譲る","クラクションを鳴らして注意を促す","歩行者側が車に道を譲るべきである","徐行すればそのまま通過してよい"],"explain":"横断歩道内の歩行者には常に優先権があり、運転者は停止して道を譲らなければなりません。"},{"id":15,"catKey":"signals","correct":1,"q":"黄色信号が意味することとして正しいのはどれですか？","choices":["加速して交差点を通過する合図である","安全に停止できる場合は停止しなければならない","赤信号と同じで無視してよい","常に一時停止して待つ合図である"],"explain":"黄色信号は「まもなく赤に変わる」警告で、安全に停止できるなら停止し、すでに交差点に近すぎる場合のみ注意して通過します。"},{"id":16,"catKey":"highway","correct":1,"q":"幅の狭い山道で対向車とすれ違いができない場合、道を譲るべき（必要ならバックする）のはどちらですか？","choices":["上り坂を走行中の車","下り坂を走行中の車","車体の大きい車","速度が速い車"],"explain":"下り坂を走行している車の方が一般的にバックしやすいため、道を譲る義務があります。"},{"id":17,"catKey":"lanes","correct":1,"q":"Uターンをしてはいけない状況として正しいのはどれですか？","choices":["住宅地であればどこでもUターンできない","前後200フィートの見通しが確保できない場所","交差点内であれば常に禁止されている","制限速度が高い道路でのみ禁止される"],"explain":"前後200フィートにわたり他の車から自分の車が見通せない場所でのUターンは禁止されています。"},{"id":18,"catKey":"signals","correct":0,"q":"ラウンドアバウト（円形交差点）に進入する際の基本ルールはどれですか？","choices":["既に環道内を走行している車に道を譲る","進入しようとしている車が常に優先される","信号がないため早い者勝ちである","常に右方の車が優先される"],"explain":"ラウンドアバウトでは、すでに環道内を走行している車が優先され、進入する車はその流れが途切れるのを待って道を譲ります。"},{"id":19,"catKey":"provisional","correct":1,"q":"プロビジョナル（仮）免許取得後12か月間、18歳未満の運転者に原則適用される同乗者の制限として正しいのはどれですか？","choices":["同乗者の制限はない","20歳未満の同乗者は原則同乗できない（例外規定あり）","家族のみ同乗できる","同乗者は2人までと決まっている"],"explain":"免許取得後12か月間は、親・保護者、25歳以上の免許保有者、または認定指導員の同伴がなければ、20歳未満の同乗者を乗せられません。"},{"id":20,"catKey":"provisional","correct":1,"q":"同じくプロビジョナル期間中、18歳未満の運転者の運転が原則として制限される時間帯はどれですか？","choices":["午前5時から午後11時まで","午後11時から午前5時まで","終日運転できない","週末のみ制限される"],"explain":"免許取得後12か月間は、原則として午後11時から午前5時までの運転が制限されます（通学・通勤など例外あり）。"},{"id":21,"catKey":"parking","correct":1,"q":"自転車専用レーンに自動車が入ってもよいのは主にどのような場合ですか？","choices":["渋滞時の抜け道として使う場合","曲がる直前200フィート以内で車線変更する場合","駐車スペースがなければいつでも","自転車が見当たらなければいつでも"],"explain":"自動車は、右左折の直前200フィート以内など決められた場合を除き、自転車専用レーンを走行してはいけません。"},{"id":22,"catKey":"safety","correct":2,"q":"カリフォルニア州のシートベルト着用義務について正しいのはどれですか？","choices":["運転者のみ着用義務がある","前部座席の同乗者のみ着用義務がある","運転者と全ての同乗者に着用義務がある","高速道路走行時のみ義務がある"],"explain":"座席の位置にかかわらず、運転者と全ての同乗者にシートベルトの着用が義務付けられています。"},{"id":23,"catKey":"safety","correct":1,"q":"カリフォルニア州法で、原則として子どもを後ろ向きのチャイルドシートに乗せる必要があるのは何歳未満ですか（体重・身長による例外規定あり）？","choices":["1歳未満","2歳未満","4歳未満","8歳未満"],"explain":"原則として2歳未満の子どもは後ろ向きのチャイルドシートに乗せる必要があります（一定の体重・身長を超える場合は例外）。"},{"id":24,"catKey":"weather","correct":3,"q":"車の「制動距離（ストッピングディスタンス）」に影響を与える要素として当てはまらないのはどれですか？","choices":["走行速度","運転者の反応時間","路面の状況","車のボディカラー"],"explain":"制動距離は速度・反応時間・路面状況・タイヤの状態などに左右されますが、車体の色は影響しません。"},{"id":25,"catKey":"lanes","correct":0,"q":"車線が空いているかどうかを確かめるために、その車線に入る前にあなたは次のことをしなければならない：","choices":["頭を回して後ろを見る","左側にあるサイドミラーで後ろを見る","バックミラーで後ろを見る"],"explain":"ミラーには死角があります。車線変更の前には必ず頭を回し、肩越しに直接確認します。","src":"過去問 No.1"},{"id":26,"catKey":"defensive","correct":1,"q":"もしあなたが怒ったり、感情的に高ぶっているならば、次のことをしなければならない：","choices":["問題を忘れるために運転する","運転する前に「頭を冷やす」","運転しながら気分を静める"],"explain":"怒りや興奮は 前方を見るべきですか：","choices":["4から5秒前方","6から8秒前方","10から15秒前方"],"explain":"早めに危険を見つけるため、遠くまで視線を向けます。現行のハンドブックでは「少なくとも10秒先」を見るよう案内しています。","src":"過去問 No.27"},{"id":52,"catKey":"defensive","correct":0,"q":"あなたの車の後方での交通状況をしばしばチェックすべきですか：","choices":["はい、あなたの車のすぐ後ろに着いて来ている車があれば、それを知ることができる","いいえ、前を走る車に注意すべきです","いいえ、交通が非常に混雑していない限り"],"explain":"後方の様子を定期的に確認すれば、接近している車に早く気づき、余裕をもって対応できます。","src":"過去問 No.28"},{"id":53,"catKey":"lanes","correct":2,"q":"あなたが前の車に接近し過ぎていて、突然あなたの車の前にほかの車が割り込んできた時の最善な処置は：","choices":["ブレーキペダルを急激に踏む","あなたの隣の車線にそれる","アクセルペダルからあなたの足を離す"],"explain":"急ブレーキや急な車線変更は追突や衝突を招きます。まずアクセルから足を離して車間距離を広げます。","src":"過去問 No.29"},{"id":54,"catKey":"safety","correct":0,"q":"16歳またはそれより年上の乗客はシートベルトを付けないために違反切符を受けるでしょうか：","choices":["はい","はい、しかし前の席に座っている場合だけ","いいえ"],"explain":"16歳以上の同乗者は、シートベルト未着用なら本人が違反切符を受けることがあります。座席の位置は関係ありません。","src":"過去問 No.30"},{"id":55,"catKey":"lanes","correct":1,"q":"あなたがほかの車を追い越すために自分の車線から出る時、再び元の車線にもどるのに十分な間隔の余裕があると知るのは次の時です：","choices":["ほかの車の前のバンパーを通過した","ほかの車の両方のヘッドライトがバックミラーで見ることができる","ほかの車から三台分の間隔がある"],"explain":"追い越した車の両方のヘッドライトがバックミラーに見えれば、元の車線に戻る余裕があります。","src":"過去問 No.31"},{"id":56,"catKey":"defensive","correct":0,"q":"衝突が最も起こり易いのは：","choices":["運転者が交通の流れよりも早く走るか遅く走る","橋か高架道路","車線の沢山ある高速道路"],"explain":"周囲の流れより速すぎても遅すぎても、衝突の危険は高まります。","src":"過去問 No.32"},{"id":57,"catKey":"defensive","correct":0,"q":"防御的運転とは：","choices":["生き残るための運転技術です","他の運転者に丁寧であること","トラック運転者によって実践されている"],"explain":"防御運転とは、他の運転者のミスも想定して早めに危険を避ける、身を守るための運転技術です。","src":"過去問 No.33"},{"id":59,"catKey":"signals","correct":1,"q":"交差点を塞いでしまうことは：","choices":["もしも緑か黄色の信号で入り、信号が赤になる前に交差点を通過できなかった場合は許される","決して許されません","あなたの横の車線が塞がっている時は許される"],"explain":"信号の色に関係なく、渡り切れないときは交差点に入らず、交差点を塞がないようにします。","src":"過去問 No.35"},{"id":61,"catKey":"pedestrians","correct":0,"q":"盲導犬を連れていたり、白い杖をもっている歩行者には必ず：","choices":["常に優先権を与えなければならない","角にいる場合だけ優先権を与えなければならない","いつ道を横断できるかを教えてあげなければならない"],"explain":"白い杖を持つ人や盲導犬を連れた人には、常に優先権を与えます。","src":"過去問 No.37"},{"id":62,"catKey":"signals","correct":2,"q":"交差点に入るのは次の場合、違反です：","choices":["信号が黄色の時","赤の信号が点滅しており、あなたがまだ完全に停車していない時","横からの交通を妨げずには横切れない時"],"explain":"交差する交通を妨げずに渡り切れないときに交差点へ入ると、違反になります。","src":"過去問 No.38"},{"id":63,"catKey":"parking","correct":2,"q":"二方向交通道路の下り坂のところで駐車する時は、前輪を次のようにしなければならない：","choices":["左方向に、縁石から離れるように回しておく","縁石と平行にしておく","右方向に、縁石に向かって回しておく"],"explain":"下り坂では前輪を縁石側（右）に向けます。車が動き出しても縁石で止まります。","src":"過去問 No.39"},{"id":64,"catKey":"pedestrians","correct":2,"q":"もし歩行者が信号や横断歩道のない交差点を横切っているならば：","choices":["車に優先権がある","車は速度を落とし、注意しながら前進する","歩行者に優先権がある"],"explain":"信号や標示がなくても、交差点を渡る歩行者には優先権があります。","src":"過去問 No.40"},{"id":65,"catKey":"signs","correct":2,"img":"data:image/gif;base64,R0lGODlhKgAyAMQAAMzMzDAwMCUlJfHx8ezs7Lm5ufv7+2ZmZsPDw4iIiPb29tXV1aamptvb20lJSePj4zc3Nzg4OEBAQDU1NT09PTY2Nj8/Pzk5OT4+Pjw8PPn5+Ts7O/z8/Do6Ov39/f///yH5BAAAAAAALAAAAAAqADIAAAX/oCd6hqacimZw3GcMCnkadEloKmqcOL4ans/HYzKlaDAOrKgopYoqJo5TLGmCwqx2O+QODUKScGXcFRkJhnrNbrsZhTg8XkAgHkQOycMQ+P+AgX8Bg4GEAgEQARcJAyswBxMSkxCTFhQbFBURGxEVAR0SFhWiARMTAakdFxcTEB0CCB9GBwGiGKIdGR0WAg4bhBKnERSnExWnFRnGFxkWFgEFHCketZOTGA4SngwKAAAJAQ4WEhuox4SppqgUGBnRHjMHlRIYG/QSDB4wIpHaGBbMTbjQYYKAWuYyvIo2rck8bRIoZCCWQMGAiwQMhMN0gULEVK0uYKhkqgKGCQWI/1xJMMGBS20WLjgAYGbAB2seJejCEEGcBAGfUEGgEO2DRQ8sr2mj4EAAA6MsGDiAUEHbhqrCQHVwkOrYhp8I4g3gYA2XgwjbDgwg8KFAJEQSpkLE0AGDSK7rJlAQkJLDikj1PBaMC8CbnwkZTkaQ9MyCS3WmqH4NgKCGhgMy6131KCDBhz4xiX4idOBeBmQDJQRbiGAaJAguI25gFcBzAQGifp4Sd8DBBAxdhW3qsGEDX9dIYTvgSQECcAYGAGSgULB3b5cdEp0FGqBCM7SUZw1AKmmSxFBOPwBIdZXQblQZyt0bhmtSAACzYiSIYDWCu5/6FNBdMhcQgksEF2yQjf8pnlBATi9hlXCTJO6QE19nbYGyG2QjCYQMKKbMZsEEAMhAVkvEfWVfNw9UgAggBl4ADTLIQDBQBKHcR8UOpaFFz4sMTFNAAgUswMABSHLlCSqkDOSgiveZQMQB2ZBzQT4JOJVCCy1ooQEDAfDkCl2TnIZWLESkgJk2EyTwwAcI1GZAA3UgUKedCIA5zmwdUBABghjgQmI8PIIXZFu9FPDBAmc50I55qCxyTE/NgZIYKwuIoEJvElSUYUFPIYVIOqRCsMspGWQA0WnC4JemP2wtEKYw+iiwQAK44opkb8AJ8EoEAhDTJ38VlPhqmyZgVlwAamkQRhcG3EDAAw304YD/M3FZCJYIJczTAAcCSrBLUwk00MACDVg0Xhb7aJAABOSQkqpIsXxxmQQPGKCaMxR0dBhpu+pamAcC/naKR7NNsMAQyVaQrk66mOPfKRKMdsgf0iwQWHOk2BJBiU4c0MEDHPg2QQTvpHLWOooEkMFs8B ろまで運転し、停車して休む"],"explain":"眠気には休憩が一番です。安全な場所まで運転して車を止め、休みます。","src":"過去問 No.46"},{"id":71,"catKey":"signals","correct":2,"q":"一時停止標識のある角に来た時、次のようにして先ず停車しなければならない：","choices":["横断歩道を通り越してから","横切っている交通が見えるところまで進んでから","横断歩道の手前で"],"explain":"一時停止標識では、停止線があれば停止線の手前、なければ横断歩道の手前で止まります。","src":"過去問 No.47"},{"id":72,"catKey":"defensive","correct":2,"q":"もしあなたが交通違反を繰り返し犯すと：","choices":["DMVはあなたの車を取り上げる","DMVはあなたの運転する特権を停止する","上記の両方"],"explain":"違反を繰り返すと、運転特権の停止に加えて、車の押収などの処分を受ける可能性があります。","src":"過去問 No.48"},{"id":73,"catKey":"lanes","correct":0,"img":"data:image/gif;base64,R0lGODlhKgAyAMQAAIKCgvr6+r29ve7u7kdHR/b29jg4OP39/ZGRkdTU1FVVVSgoKFxcXA4ODtra2vHx8Zqamt3d3aOjo7i4uHFxceLi4sjIyObm5qurq83NzWRkZLCwsBYWFurq6gAAAP///yH5BAAAAAAALAAAAAAqADIAAAX/4CeOZGmeaKqubOu+a2UFZVW0TkU6BHKkDM9m1FFwKD9VhGN4jCaehhMVpIwiHo+CprI0PJGRtzEAegCjRJaRTA0WYHGDnNJ4JiNJVtFOGTw6IlB0KHYCIxUGDUMsFBRcHwJRZSgKHodEDjAkEXOUJ5aYIg4Wn10WJJKEoHcjFxxnLBUNBJCqpiUKDQkjDlkILBkeTSO3KUaQWB7AKxlfYSLGlZcjwsssDg0cF8WTKAEE1CIVcBAsBwYaqd7Toh8ZEh0tFdCC7CcU4iIPCX0pDlNEJPBUR9+BfLxWXFjAANLAVSZCjQDnIQOLB0xu2IOYywMqER0WNLC4IsACAxoj/92LWDFPFHcpTqaUxgqPvWssCABoQ5OlqAAUFnxc0QHSBz0cSUh0BUHeigcaNAREsLLjTzvmFMLSFK0qCUOIvkgI9qxb0hEQ9A34g4EsILO4SOhpK+KAJWYqhGmw5dUlGrQLYJ4IIKGeyrMi0v6tG3BTzxJ2rCCaYDSFBAg8+4oIsjhAEEYrFiyYqflDlREFwiFhIRNuQZQiUnuoxRp2V8QfqG6JHY52aNuH446IPOKgBwn+TgDY2c1AZaUeGJCoMCF5C0nSU+RbvGkD164KVFBl0wvBUBULuEsKb4bYB9nkVcxSr0VFEPdvPKxWMTC+SvZUDDMFRXihB5wkkk3jnjhsu/1GGncmADCMRhTthx4Hn2BQ3z8UCNAGVRCeUMACvn2QgAJjwTAABIZ9kwE3m8Qo44w01jhjCAA7","q":"二方向交通の道路の中央にある車線は次の場合に使うことができます：","choices":["左折を始めたり、終わろうとしている場合","他の車に追い付いたり、追い越したりする場合","左か右に曲がろうとしている場合"],"explain":"中央の左折専用車線は、左折を始めるときと終えるときにだけ使います。追い越しや通常の走行には使えません。","src":"過去問 No.49"},{"id":74,"catKey":"pedestrians","correct":1,"q":"自転車に乗る人は必ず：","choices":["自転車道のないところでは交通方向に対面して走らなければならない","自動車に追い越される場合、安全なスペースの余地が与えられなければならない","道を横切る時は、絶対に自転車を降りて歩いてはいけない"],"explain":"自転車を追い越すときは十分な間隔を空けます。法律では少なくとも3フィートが必要です。","src":"過去問 No.50"},{"id":75,"catKey":"signs","correct":2,"img":"dat べきですか：","choices":["はい、他の運転者が間違いを起こした時に、それに対応する時間がある","いいえ、「間隔クッション」は必要ありませんー高速道路の貴重な場所を取る","いいえ、誰かがあなたの前に割り込んでくるから"],"explain":"車の周囲に空間を確保すると、他の運転者がミスをしても対応する時間が生まれます。","src":"過去問 No.60"},{"id":85,"catKey":"defensive","correct":1,"q":"前方の危険を見つけ易くするためには、あなたの目を次のように使う：","choices":["前を走る車に焦点をおく","目を動かす（周囲を見渡す）","目を疲れさせないようにする"],"explain":"一点を見つめず、目を動かして周囲を確認し続けると、危険に早く気づけます。","src":"過去問 No.61"},{"id":86,"catKey":"weather","correct":0,"q":"衝突事故の最も大きな共通した一つは：","choices":["危険なスピード","シートベルトを着用しないで運転する","雨降りの時運転する"],"explain":"速度の出しすぎは、衝突事故に共通する大きな原因の一つです。","src":"過去問 No.62"},{"id":88,"catKey":"defensive","correct":0,"q":"もしもあなたの車にハンドルロック装置がある場合、車がまだ動いている時イグニションを切ることがあってもいいですか：","choices":["いいえ、ハンドルが固着して、車をコントロールできなくなる","はい、イグニションを切っても運転のコントロールには影響しない","下り坂を惰力で走り下る場合を除いては駄目"],"explain":"走行中にイグニションを切るとハンドルがロックされ、操作できなくなります。","src":"過去問 No.64"},{"id":90,"catKey":"defensive","correct":0,"q":"道路の中央に二重実線がひかれてある場合、次のことをするために横切ってはいけません：","choices":["前の車を追いつき追い越すため","左に曲がるため","個人のドライブウェーに入って行くため"],"explain":"二重の実線を越えて追い越すことはできません。左折や私道への出入りでは横切れます。","src":"過去問 No.66"},{"id":91,"catKey":"lanes","correct":1,"q":"左折を二車線のどちらからでもできる交差点では、Uターンを次の車線からすることができます：","choices":["二車線のどちらからでも","左車線からだけ","空いていればどの車線からでも"],"explain":"二車線から左折できる交差点では、Uターンは一番左の車線からだけできます。","src":"過去問 No.67"},{"id":93,"catKey":"signals","correct":2,"q":"黄色の信号が点滅している交差点に来た時は：","choices":["横断する前に停車する","信号が緑に変わるのを待つ","速度を落として注意して横断する"],"explain":"黄色の点滅は「注意して進め」です。止まる必要はありませんが、速度を落として注意して通過します。","src":"過去問 No.69"},{"id":94,"catKey":"highway","correct":1,"q":"高速道路の入り口から高速道路に入り、交通に合流する時は、次の速度で入らなければならない：","choices":["高速道路の法律で指定された制限速度","高速道路の交通の流れの速さと大体同じ速度","高速道路の制限速度より十マイル遅い速度"],"explain":"合流は、高速道路を流れる車とほぼ同じ速度で行うと安全です。","src":"過去問 No.70"},{"id":95,"catKey":"parking","correct":0,"q":"色が塗られている縁石の正しい意味は：","choices":["黄 積んだり降ろしたりするだけ","赤 限られた時間だけ駐車する。しかしバスのためには譲る","白 商業用車だけ"],"explain":"黄色の縁石は積み下ろし用です。赤は駐停車禁止、白は乗客の乗降や郵便物用です。","src":"過去問 No.71"},{"id":96,"catKey":"dui","correct":0,"q":"開封されたアルコールの入っている飲み物の容器を車の中に置くことは違法です。ただ "id":130,"catKey":"defensive","correct":2,"q":"運転中、前方の10秒から15秒間で着く地点を注意して見る理由は次の内どれですか？","choices":["サイドミラーを使わないで済ませるため","法律でそうするように決められているため","危険を早くから知っておくため"],"explain":"先の様子を見ておくことで、危険を早く見つけ、余裕をもって対応できます。","src":"過去問 No.106"},{"id":131,"catKey":"signals","correct":1,"q":"信号がなく、入る直前まで交差する車が見えない交差点での制限速度は幾らですか？","choices":["時速25マイル","時速15マイル","時速10マイル"],"explain":"直前まで交差する車が見えないブラインド交差点の制限速度は時速15マイルです。","src":"過去問 No.107"},{"id":132,"catKey":"signals","correct":0,"q":"交差点に入ると法律違反になるのは：","choices":["赤信号に変わっても向こう側に着かない時","黄色のランプが点滅しているが、はじめに止まらなかった時","黄色になったが安全でないので止まれなかった時"],"explain":"交差点では、信号が赤になる前に渡り切れないのに進入すると、交差点を塞ぐ違反になります。","src":"過去問 No.108"},{"id":133,"catKey":"defensive","correct":2,"q":"次の事は車を安全にバックさせるために大切ですが、1つだけ必要ではありません。それは：","choices":["バックする時、右肩越しに振り返って見る","車に入る前に車の後ろに何もない事を調べる","バックする前にクラクションを鳴らす"],"explain":"バックの前にクラクションを鳴らす必要はありません。乗車前の後方確認と、肩越しの確認が大切です。","src":"過去問 No.109"},{"id":134,"catKey":"defensive","correct":0,"q":"大型トラックについて次に述べる事の内、どれが正しいですか？","choices":["大型トラックは完全に止まるまで時間がかかる","大型トラックはエアブレーキがあるので早く止まる事ができる","大型トラックは乗用車より操縦しやすい"],"explain":"大型トラックは車体が重く、完全に止まるまでに乗用車より長い距離と時間がかかります。","src":"過去問 No.110"},{"id":135,"catKey":"lanes","correct":1,"q":"制限速度が65マイルの高速道路で、あなたは最も左の車線を時速55マイルで走っています。運転が遅過ぎるために罰金が課せられる可能性はあるでしょうか？","choices":["道路状況や天候のためにゆっくり走る必要がある場合には罰金が課せられる","車全体の通常で正当な流れを妨げている場合には罰金が課せられる","いつも他の車よりゆっくりと走る方が安全なので、罰金が課せられるはずはない"],"explain":"道路や天候で必要な場合を除き、通常の流れを妨げるほど遅く走ると違反切符を受けることがあります。","src":"過去問 No.111"},{"id":136,"catKey":"lanes","correct":1,"q":"次の死角について述べたものの内、どれが正しいですか？","choices":["右の車線に変わる時も左の車線に変わる時も右肩越しに振り返って見ればよい","右の車線に変わる時は右肩越しに振り返って、左の車線に変わる時は左肩越しに振り返って見る","車の外の両側に鏡がついている車に死角はない"],"explain":"右へ移るときは右肩越し、左へ移るときは左肩越しに確認します。ミラーがあっても死角は残ります。","src":"過去問 No.112"},{"id":137,"catKey":"defensive","correct":2,"q":"車が横滑りをし始めた場合、あなたはどうするべきですか？","choices":["牽引力をつけるために一定の速度で運転する","滑らないようにブレーキをしっかりと踏む","だんだん速度を落とす。ブレーキを踏んではいけない"],"explain":"滑り始めたら、アクセルからゆっくり足を離し、ブレーキは踏みません。","src":"過去問 No.113"},{"id":138,"catKey":"dui","correct":0,"q":"飲酒運転で逮捕され、アルコールの血中濃度を調べるテストを拒否した場合：","choices":["あなたの免許証は少なくとも一年間は取り上げられます","無理に採血される事はない","テストをする前に弁護士と話す権利があります"],"explain":"化学検査を拒否すると、運転特権が少なくとも1年間停止されます。","src":"過去問 No.114"},{"id":139,"catKey":"lanes","correct":2,"q":"商業地域でのUターンは：","choices":["危険なのでいつしても法律違反になる","教会やアパートや社交クラブのある場所では違反ではない","してはならないという標識がない限り交差点でしてもよい"],"explain":"商業地域では、標識で禁止されていなければ交差点でUターンできます。","src":"過去問 No.115"},{"id":140,"catKey":"weather","correct":1,"q":"スモールライト（駐車灯）だけを使って運転しても良いのはいつですか？","choices":["日の入りの30分後と日の出の30分前です","どんな時もしてはいけません","可視度が低い霧の出る日です"],"explain":"駐車灯（スモールライト）だけで走行することは認められません。必要なときはヘッドライトを点けます。","src":"過去問 No.116"},{"id":141,"catKey":"lanes","correct":1,"q":"間が60cm以上離れて引いてある二組の黄色い二本の実線は：","choices":["私用の車道に入る時だけ横切る事ができる","壁のような物と見なすべきもので、横切る事はできない","左折の始めか終りの車線を意味する"],"explain":"2フィート以上離れた二組の二重実線は障壁（壁）として扱います。指定された開口部以外では、横断も左折もUターンもできません。","src":"過去問 No.117"},{"id":142,"catKey":"lanes","correct":1,"q":"夜、向こうから来る車のヘッドライトがハイビームになっている時、どうするべきですか？","choices":["あなたの車のハイビームを速く点滅させて向こうから来る車の運転手に合図する","右車線の方か、道路の右端の方を見る","速度を落としてまっすぐ先を見る"],"explain":"対向車のライトを直接見ず、右車線や道路の右端に視線を移します。","src":"過去問 No.118"},{"id":143,"catKey":"weather","correct":1,"q":"雨や雪が降ったり霧の出る日にヘッドライトをつけますが：","choices":["ハイビームにします","他の運転手にあなたの車が見えるようにつける","他の運転手に天候の悪い事を警告するためにつける"],"explain":"悪天候でヘッドライトを点けるのは、他の運転者から見えるようにするためです。","src":"過去問 No.119"},{"id":144,"catKey":"defensive","correct":0,"q":"表示されていない場合、商業地域での制限時速は何マイルですか？","choices":["時速25マイル","時速20マイル","時速30マイル"],"explain":"標識がない商業地域の制限速度は時速25マイルです。","src":"過去問 No.120"},{"id":145,"catKey":"defensive","correct":2,"q":"近づいて来る車があなたの車の前で左折し始めました。あなたは：","choices":["クラクションを鳴らして警告し、同じスピードのまま走りつづける","その車が曲がり切る前に、その横を回り込んで行けるようにハンドルを右の方に切る","事故が起こらないように車の速度を落とす。または車を止める"],"explain":"相手が曲がり始めたら、自分に優先権があっても減速または停止して衝突を避けます。","src":"過去問 No.121"},{"id":146,"catKey":"signs","correct":2,"q":"左折車線の上にa left-or U-turn is allowed on a left arrow only （左向き矢印の時のみ左折またはUターンができる）と書かれた標識が出ています。この意味は：","choices":["左折かUターンのどちらかをしなければならない","どんな信号でも緑であれば、左折やUターンができる","信 ":"出口へは1車線ずつ、合図と確認をしながら移ります。一度に複数の車線を横切りません。","src":"過去問 No.144"},{"id":160,"catKey":"weather","correct":1,"q":"道路標識の制限速度は55マイルと出ています。道路が濡れている時、あなたは：","choices":["時速55マイルで走行を続けるべきです","5マイルか10マイル制限速度より速度を落とすべきです","20マイルか25マイル制限速度より速度を落とすべきです"],"explain":"濡れた路面では、制限速度より時速5〜10マイル落とします。","src":"過去問 No.145"},{"id":161,"catKey":"highway","correct":0,"q":"速度を落として運転するべきなのはどんな場合ですか？","choices":["前方の何台かの車のブレーキライトがついている場合","高速道路で大きなトラックを追い越す場合","すでに処置できている事故現場の横を通り過ぎる場合"],"explain":"前方で複数の車のブレーキランプが点いていれば、減速や渋滞の合図です。早めに速度を落とします。","src":"過去問 No.146"},{"id":162,"catKey":"weather","correct":2,"q":"滑りやすい道路で車が横すべりを始めた場合、あなたは：","choices":["ブレーキを何度も掛ける","ブレーキを強く掛ける","ブレーキを掛けるのを止める"],"explain":"滑り始めたらブレーキをやめ、速度が落ちるのを待ちます。","src":"過去問 No.147"},{"id":163,"catKey":"defensive","correct":2,"q":"夜運転する時、ヘッドライトのハイビームは：","choices":["できるだけ使わないようにする","照明されていない道路を運転する場合に限って使う","法律違反でなく安全である限り、いつでも使う"],"explain":"法律で禁止されておらず安全な限り、ハイビームを使うと遠くまで見えます。対向車や先行車の近くでは切り替えます。","src":"過去問 No.148"},{"id":164,"catKey":"lanes","correct":1,"q":"あなたは車線が1つの道路を運転しています。前方のドライバーは明白な理由もなく速度をしばしば落とします。このような時、カリフォルニア・ドライバーの手引（California Driver Handbook）によると：","choices":["できるだけ早く先行車を追い越すためスピードを出すべきです","あなたの車と先行車の距離を十分取るべきです","先行車が気付くようにヘッドライトを点滅させるべきです"],"explain":"予測しにくい動きをする車の後ろでは、車間距離を多めにとります。","src":"過去問 No.149"},{"id":165,"catKey":"dmv","correct":2,"q":"交通事故にまき込まれた場合、相手にあなたの免許証を見せる他にどんな物を見せるべきですか？","choices":["経済責任証のみ","経済責任証と自動車登録証","経済責任証と自動車登録証と現住所"],"explain":"事故の相手には、免許証、自動車登録証、保険情報、現住所を見せます。","src":"過去問 No.150"},{"id":166,"catKey":"highway","correct":0,"q":"3車線ある高速道路で、大型トラックが真中の車線を走行しています。あなたは大型トラックを追い越したいと思います。この場合：","choices":["左から早く追い越して、トラックの前に行く方が良い","左から非常にゆっくり追い越して、トラックの前に行く方が良い","右から非常に早く追い越して、トラックの前に行く方が良い"],"explain":"大型トラックは死角が大きいので、左側から速やかに追い越して前に出ます。横に長く並びません。","src":"過去問 No.151"},{"id":167,"catKey":"defensive","correct":0,"q":"あなたの車が追突されそうです。この場合、あなたがするべき事は：","choices":["追突されてからブレーキを踏む用意をする","ブレーキを踏んだままでいる","ニュートラルにしてエンジンを止める"],"explain":"追突が避けられないときは、衝突後の動きに備えてブレーキを踏めるようにしておき、車をコントロールします。","src":"過去問 No.152"},{"id":168,"catKey":"defensive","correct":1,"q":"車をバックさせる時、あなたがするべき事は：","choices":["バックミラーに頼る","車の後ろの窓越しに見る","バックミラーとサイドミラーに頼る"],"explain":"バックするときは、ミラーだけに頼らず後ろの窓越しに直接確認します。","src":"過去問 No.153"},{"id":169,"catKey":"defensive","correct":1,"q":"車全体の流れよりも遅い速度で運転すると：","choices":["事故が起こりにくい","事故が起こりやすい","事故が起こる可能性は変わらない"],"explain":"周囲より極端に遅いと速度差が生まれ、事故が起こりやすくなります。","src":"過去問 No.154"},{"id":170,"catKey":"signals","correct":0,"q":"鉄道線路の前で停止した後、線路を横切っても良いのは：","choices":["両方向にはっきり見晴らせる場合","列車が通り過ぎた後すぐ","列車が全く見えない場合"],"explain":"列車は反対方向からも来るので、両方向がはっきり見えてから渡ります。","src":"過去問 No.155"},{"id":171,"catKey":"weather","correct":0,"q":"霧が深い時や砂ほこりがひどい時には：","choices":["状態が良くなるまで運転しない","他の車と衝突する可能性があるので、あまり遅い速度で運転しない事","よく見えるようにロービームとハイビームを交互に使う"],"explain":"濃霧や砂ぼこりの中では、運転を避け、状況が良くなるまで待つのが最善です。","src":"過去問 No.156"},{"id":172,"catKey":"signs","correct":1,"q":"右向きの矢印でone way（一方通行）と書かれている標識はどういう意味ですか？","choices":["右の方に車線が1つの道路がある","右方向に行く一方通行の道路","どの車も前方で右に曲がらなければならない"],"explain":"ONE WAYの矢印は、その方向にだけ進める一方通行の道路を示します。","src":"過去問 No.157","img":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNDAgNzAiPgogIDxyZWN0IHg9IjQiIHk9IjQiIHdpZHRoPSIxMzIiIGhlaWdodD0iNjIiIGZpbGw9IiMwMDAwMDAiIHN0cm9rZT0iI0ZGRkZGRiIgc3Ryb2tlLXdpZHRoPSIyIi8+CiAgPHRleHQgeD0iNTUiIHk9IjQyIiBmb250LWZhbWlseT0iQXJpYWwsIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjAiIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiNGRkZGRkYiIHRleHQtYW5jaG9yPSJtaWRkbGUiPk9ORSBXQVk8L3RleHQ+CiAgPGxpbmUgeDE9IjEwNSIgeTE9IjM1IiB4Mj0iMTI4IiB5Mj0iMzUiIHN0cm9rZT0iI0ZGRkZGRiIgc3Ryb2tlLXdpZHRoPSI1Ii8+CiAgPHBvbHlnb24gcG9pbnRzPSIxMjgsMzUgMTE4LDI3IDExOCw0MyIgZmlsbD0iI0ZGRkZGRiIvPgo8L3N2Zz4="},{"id":174,"catKey":"lanes","correct":2,"q":"あなたは2車線ある道路で左の車線を走行しています。多くの車が右側からあなたの車を追い越して行きます。あなたはどうするべきですか？","choices":["車の流れをじゃましないように左の車線に留まる","道路の左肩に車を寄せて停車し、他の車を先に行かせる","安全な時に右の車線に入る"],"explain":"左車線で右側から何台も追い越されるのは遅いしるしです。安全なときに右車線へ移ります。","src":"過去問 No.159"},{"id":175,"catKey":"lanes","correct":1,"q":"破線の黄色線と、それに並んで実線の黄色線が引かれてい ばどの車線からでもよい","左カーブ(左側の縁石)に最も近い車線から","道路の中央の車線から"],"explain":"一方通行同士をつなぐ左折では、左側の縁石に最も近い車線から曲がり始め、曲がった先も左側の車線に入ります。"},{"id":212,"catKey":"dmv","correct":1,"q":"交通事故に遭った場合、DMVに「SR1」という報告書を提出しなければならないのはどのようなときですか?","choices":["自分か相手のどちらかが怪我をした場合のみ","物的損害が1,000ドルを超えるか、怪我人が出た場合","自分に過失がある場合のみ"],"explain":"物的損害が1,000ドルを超える、または怪我人が出た事故は、DMVへSR1報告書を提出する義務があります。"},{"id":215,"catKey":"dmv","correct":2,"q":"駐車中の車に接触する物損事故を起こしたが、所有者が見つからない場合、すべきことはどれですか?","choices":["車両にメモ(連絡先)を残す","速やかに警察(市外ならCHP)に事故を報告する","上記の両方"],"explain":"所有者が見つからない場合は、車にメモを残すとともに警察やCHPへの通報も必要です。"},{"id":216,"catKey":"parking","correct":1,"q":"縁石のない双方向道路の上り坂に駐車する場合、前輪はどの向きにすべきですか?","choices":["道路(車道)側に向ける","道路から離れる方向(右)に向ける","常に路面と平行にする"],"explain":"縁石のない上り坂では、万一車が後退しても道路に飛び出さないよう前輪を道路から離れる方向(右)に向けます。"},{"id":217,"catKey":"emergency","correct":0,"q":"学校の横断歩道に立つ警備員(クロッシングガード)の指示について正しいのはどれですか?","choices":["常にその指示に従わなければならない","授業時間中だけ従えばよい","子どもがいないときは無視してよい"],"explain":"学校の横断歩道の警備員がいる場合は、常にその指示に従う必要があります。"},{"id":218,"catKey":"lanes","correct":0,"q":"他の車を追い越す予定があるとき、してはいけない思い込みはどれですか?","choices":["他のドライバーが自分の車線に戻るためのスペースを空けてくれると決めつけること","追い越す前に周囲を確認すること","安全な速度で追い越すこと"],"explain":"ウインカーを出したからといって、相手が必ずスペースを空けてくれるとは限りません。自分で安全を確認することが重要です。"},{"id":219,"catKey":"emergency","correct":1,"q":"交差点のちょうど真ん中を走行しているときに緊急車両のサイレンが聞こえた場合、どうすべきですか?","choices":["その場で右に寄って停止する","そのまま交差点を直進し、通過してから右に寄って停止する","そのまま交差点を直進し、通過してから左に寄って停止する"],"explain":"交差点の真ん中では急停止せず、交差点を安全に通過してから道路の右側に寄って停止します。"},{"id":220,"catKey":"lanes","correct":1,"q":"各方向1車線の道路で、他の車を次々に追い越し続けると、どうなりますか?","choices":["目的地により速く安全に到着できる","事故に遭う可能性が高まる","渋滞の防止に役立つ"],"explain":"対向車線を使った追い越しを繰り返すことは、正面衝突などの重大事故のリスクを大きく高めます。"},{"id":221,"catKey":"signals","correct":0,"q":"次の車両のうち、踏切を渡る前に必ず一時停止しなければならないのはどれですか?","choices":["危険物標識を掲示したタンクローリー","ボートトレーラーを牽引するキャンピングカーやピックアップトラック","車軸が3本以上、または総重量4,000ポンドを超える車両"],"explain":"危険物(ハザードマテリアル)を積んだ車両は、踏切の前で必ず一時停止することが義務付けられています。"},{"id":222,"catKey":"signals","correct":0,"q":"線路の反対側に、線路を完全に渡りきれるだけのスペースがない場合、どうすべきですか?","choic め、渋滞やさらなる事故の原因になることがあります。"},{"id":243,"catKey":"lanes","correct":2,"q":"他の車を追い越してよいのはどのようなときですか?","choices":["前の車が遅いとき","前の車が赤信号で停止しているとき","安全かつ合法な場合に限る"],"explain":"前の車が遅い・停止している・左折しようとしているなどの理由だけでは追い越しの根拠になりません。安全かつ合法な場合にのみ追い越します。"},{"id":244,"catKey":"provisional","correct":1,"q":"カリフォルニア州で仮免許(パーミット)を申請できる最低年齢は何歳ですか?","choices":["15歳","15歳6か月","16歳"],"explain":"カリフォルニア州では15歳6か月から仮免許(パーミット)を申請できます。"},{"id":245,"catKey":"provisional","correct":0,"q":"仮免許(パーミット)で練習運転をするとき、同乗していなければならないのはどのような人ですか?","choices":["25歳以上の免許保有者(親権者や運転指導員など)","友人であれば誰でもよい","同乗者は不要"],"explain":"仮免許での練習運転には、25歳以上の免許保有者(親・保護者や公認の運転指導員など)の同乗が必要です。"},{"id":246,"catKey":"provisional","correct":1,"q":"18歳未満で本免許(プロビジョナル免許)を取得するために必要とされる、保護者証明付きの実車練習時間の目安はどれくらいですか?","choices":["合計10時間(夜間2時間を含む)","合計50時間(夜間10時間を含む)","合計100時間(夜間20時間を含む)"],"explain":"18歳未満の申請者は、保護者などが証明する合計50時間(うち夜間10時間)の実車練習が一般的に求められます。"},{"id":247,"catKey":"provisional","correct":1,"q":"プロビジョナル免許(仮運転免許)の同乗者・夜間運転の制限が適用されるのは、免許取得後どのくらいの期間ですか?","choices":["6か月間","12か月間","18歳になるまでずっと"],"explain":"制限は免許取得後の最初の12か月間です。ただし、その前に18歳になれば、その時点で終わります。"},{"id":248,"catKey":"provisional","correct":1,"q":"プロビジョナル期間中の夜間運転制限(原則午後11時〜午前5時)の例外として認められる可能性が高いのはどれですか?","choices":["友人と遊びに行くため","仕事・学校行事・医療上の必要など正当な理由がある場合(親の同伴含む)","例外は一切認められない"],"explain":"仕事、学校の行事、医療上の必要性、親などの同伴がある場合など、正当な理由があれば夜間運転制限の例外が認められることがあります。"},{"id":249,"catKey":"provisional","correct":0,"q":"18歳未満の運転者が、初めて運転免許を取得する前に受講することが義務付けられているものはどれですか?","choices":["運転者教育(Driver Education)と実車教習(Driver Training)","大学レベルの交通法規講座","特に何も義務付けられていない"],"explain":"18歳未満で初めて免許を取得する場合、運転者教育と実車教習の修了が義務付けられています。"},{"id":250,"catKey":"provisional","correct":1,"q":"プロビジョナル免許の制限(同乗者・夜間運転など)に違反した場合、どうなる可能性がありますか?","choices":["何も起こらない","制限期間の延長や、保護者への通知・DMVへの出頭を求められることがある","自動的に免許が永久に無効になる"],"explain":"制限に違反すると、制限期間が延長されたり、保護者に通知が行われたりする可能性があります。"},{"id":251,"catKey":"provisional","correct":1,"q":"18歳以上で初めてカリフォルニア州の運転免許を取得する場合、運転者教育・実車教習の受講は法律上どうなっていますか?","choices":["18歳未満と同様に必須である","法律上は必須ではない","受講すると罰金が科される"],"explain":"18歳以上の初めての申請者には、運転者教育・実車教習の法的な受講義務はありません(推奨はされます)。"},{"id":252,"catKey":"provisional","correct":0,"q":"保護者(親権者)がDMVに対してできることとして正しいのはどれですか?","choices":["子のプロビジョナル免許の取り消しをDMVに書面で要請できる","子の代わりに運転免許試験を受けられる","DMVに対しては何の権限もない"],"explain":"保護者は、必要と判断した場合にDMVへ書面で申請し、未成年の子の運転免許の取り消しを要請することができます。"},{"id":253,"catKey":"provisional","correct":0,"q":"プロビジョナル免許の最初の12か月間、20歳未満の同乗者を乗せてよいのは、誰が同伴しているときですか？","choices":["免許を持つ親・保護者、25歳以上の免許保有者、または認定指導員","同じ学校の友人","制限に例外はない"],"explain":"20歳未満を乗せるには、免許を持つ親・保護者、25歳以上の免許保有者、または認定指導員の同伴が必要です。"},{"id":254,"catKey":"points","correct":1,"q":"一時停止無視など比較的軽微な交通違反は、運転記録上ふつう何点として記録されますか?","choices":["0.5点","1点","2点"],"explain":"軽微な違反は通常1点として運転記録に加算されます。"},{"id":255,"catKey":"points","correct":1,"q":"飲酒運転(DUI)や無謀運転(リークレスドライビング)など重大な違反は、運転記録上ふつう何点として記録されますか?","choices":["1点","2点","5点"],"explain":"DUIや無謀運転のような重大な違反は、通常2点として記録されます。"},{"id":256,"catKey":"points","correct":1,"q":"一般の運転者(成人)が、過去12か月間に何点以上たまると「問題運転者(ネグリジェント・オペレーター)」として免許停止の対象になりますか?","choices":["2点以上","4点以上","8点以上"],"explain":"12か月間に4点以上たまると、問題運転者として扱われ免許停止の対象になることがあります。"},{"id":257,"catKey":"points","correct":0,"q":"一般の運転者(成人)が、過去24か月間に何点以上たまると免許停止の対象になりますか?","choices":["6点以上","10点以上","点数に関わらず対象にならない"],"explain":"24か月間に6点以上たまると免許停止の対象になります(36か月間では8点以上)。"},{"id":258,"catKey":"points","correct":1,"q":"プロビジョナル免許を持つ18歳未満の運転者は、12か月以内に何点でDMVの聴聞や処分の対象になりますか?","choices":["1点","2点","4点(成人と同じ基準)"],"explain":"18歳未満のプロビジョナル免許保有者は、成人よりも厳しい基準(12か月で2点)が適用されます。"},{"id":259,"catKey":"points","correct":1,"q":"交通違反切符を受け取った後、期限までに出頭や罰金の支払いをしなかった場合どうなりますか?","choices":["特に何も起こらない","免許が停止される可能性がある","自動的に違反が取り消される"],"explain":"出頭や罰金の支払いを怠ると、免許停止など追加の処分を受ける可能性があります。"},{"id":260,"catKey":"points","correct":1,"q":"事故を起こしたにもかかわらず、必要な経済的責任(保険など)の証明ができない場合、どうなる可能性がありますか?","choices":["何の影響もない","免許および車両登録が停止されることがある","罰金のみで済む"],"explain":"経済的責任の証明ができない場合、免許や車両登録が停止される可能性があります。"},{"id":261,"catKey":"points","correct":1,"q":"免許が停止または取り消されている間に運転した場合、どうなりますか?","choices":["軽い注意で済む","重大な違反となり、さらに重い処分を受ける可能性がある","特に問題ない"],"explain":"停止・取り消し中の運転は重大な違反であり、さらに重いペナルティ(拘禁を含む)の対象になり得ます。"},{"id":262,"catKey":"dmv","correct":0,"q":"引っ越しなどで住所が変わった場合、DMVに通知しなければならない期限の目安はどれくらいですか?","choices":["10日以内","30日以内","1年以内"],"explain":"住所変更は原則として10日以内にDMVへ通知する必要があります。"},{"id":263,"catKey":"dmv","correct":0,"q":"他州からカリフォルニア州に引っ越して州民になった場合、カリフォルニア州の運転免許を取得しなければならない期限の目安はどれくらいですか?","choices":["10日以内","90日以内","1年以内"],"explain":"カリフォルニア州の新住民は、原則として州民になってから10日以内に州の運転免許を取得する必要があります。"},{"id":264,"catKey":"dmv","correct":1,"q":"事故現場から必要な手続き(連絡先交換や通報など)をせずに立ち去る、いわゆる「ひき逃げ」は法律上どのように扱われますか?","choices":["軽い交通違反として扱われるだけ","重大な犯罪であり、刑事罰の対象となる","物損事故であれば問題にならない"],"explain":"ひき逃げは重大な犯罪であり、負傷者がいる場合は特に重い刑事罰の対象となります。"},{"id":265,"catKey":"dmv","correct":0,"q":"運転免許証を更新するとき、一般的に求められることがあるものはどれですか?","choices":["視力検査(場合によっては筆記試験も)","新しい車の購入証明","勤務先の推薦状"],"explain":"免許更新時には視力検査が求められることが一般的で、状況によっては筆記試験の再受験が必要になる場合もあります。"},{"id":266,"catKey":"dmv","correct":1,"q":"必要な経済的責任(自動車保険など)の証明を車内に携帯せずに運転し、事故や検問で提示できない場合、どうなる可能性がありますか?","choices":["特に問題にならない","罰金や免許停止などの対象になることがある","警告のみで一切のペナルティはない"],"explain":"経済的責任の証明を提示できない場合、罰金や免許停止などの対象になることがあります。"},{"id":267,"catKey":"dmv","correct":0,"q":"車を購入した場合、新しい所有者としての登録手続きをDMVで行う期限の目安はどれくらいですか?","choices":["10日以内","60日以内","期限は特にない"],"explain":"車両を購入した場合、新しい所有者は原則として10日以内にDMVで登録手続きを行う必要があります。"},{"id":268,"catKey":"highway","correct":0,"q":"カープール(HOV)レーンを利用できるのは基本的にどのような場合ですか?","choices":["標識で指定された最低乗車人数を満たしている場合、または対象のステッカーがある場合","運転者が急いでいる場合はいつでも","制限はなく誰でも利用できる"],"explain":"HOVレーンは、標識で指定された最低乗車人数を満たす車両や、クリーンエア・ステッカーなどが交付された対象車両のみ利用できます。"},{"id":269,"catKey":"highway","correct":1,"q":"カープール(HOV)レーンに出入りしてよいのは基本的にどこですか?","choices":["どこからでも自由に出入りしてよい","破線(点線)で区切られた区間のみ","実線であっても出入りしてよい"],"explain":"HOVレーンへの出入りは、実線ではなく破線(点線)で区切られた区間で行う必要があります。"},{"id":270,"catKey":"highway","correct":1,"q":"高速道路走行中に車が故障して自力走行が難しくなった場合、まずすべきことはどれですか?","choices":["その車線にそのまま停車してハザードを点ける","可能な限り安全な右側の路肩まで車を移動させる","すぐに車を降りて反対車線側を歩いて助けを呼びに行く"],"explain":"故障した場合は、可能であれば安全に右側の路肩まで車を移動させ、ハザードランプを点灯させます。"},{"id":271,"catKey":"highway","correct":1,"q":"高速道路の出口(オフランプ)で減速するとき、正しい方法はどれですか?","choices":["本線上で十分に減速してから出口に入る","出口の減速車線に入ってから減速する","出口の直前で急ブレーキをかける"],"explain":"本線上での急な減速は追突の危険があるため、出口の減速車線に入ってから速度を落とします。"},{"id":272,"catKey":"pedestrians","correct":0,"q":"カリフォルニア州でオートバイを運転する際、運転者・同乗者に義務付けられているものはどれですか?","choices":["ヘルメットの着用","長袖の着用","特に義務はない"],"explain":"カリフォルニア州ではオートバイの運転者・同乗者ともにヘルメットの着用が義務付けられています。"},{"id":273,"catKey":"pedestrians","correct":1,"q":"オートバイが渋滞中の車列の間をすり抜けて走行する「レーンスプリッティング」について、カリフォルニア州の扱いとして正しいのはどれですか?","choices":["常に違法である","一定の安全な条件下では合法とされている","高速道路でのみ合法である"],"explain":"カリフォルニア州はレーンスプリッティングを一定の安全な条件下で合法とする数少ない州の一つです。"},{"id":274,"catKey":"pedestrians","correct":1,"q":"モーペット(原付自転車)を公道で運転するために必要なものはどれですか?","choices":["運転免許証は一切不要","有効な運転免許証(M1/M2等)","自転車用ヘルメットのみで免許は不要"],"explain":"モーペットであっても公道を走行するには有効な運転免許証が必要です。"},{"id":275,"catKey":"pedestrians","correct":1,"q":"自転車に乗っている人を追い越すとき、カリフォルニア州の法律で求められている最低限の間隔はどれくらいですか?","choices":["少なくとも1フィート","少なくとも3フィート","特に決まりはない"],"explain":"カリフォルニア州の法律では、自転車を追い越す際に少なくとも3フィートの間隔を空けることが求められています。"},{"id":276,"catKey":"safety","correct":1,"q":"子どものチャイルドシートを後ろ向きから前向きに切り替えてよい一般的な基準はどれですか?","choices":["生後6か月を過ぎればいつでも","年齢・体重・身長がメーカーの基準を満たした場合(原則2歳以上が目安)","身長に関係なく4歳になれば必ず切り替える"],"explain":"切り替えの時期は年齢・体重・身長など、チャイルドシートメーカーが定める基準を満たしているかどうかで判断します(原則2歳以上が一つの目安)。"},{"id":277,"catKey":"safety","correct":0,"q":"ブースターシートなどの安全装置の使用が原則必要とされるのは、子どもがどうなるまでですか?","choices":["8歳、または身長4フィート9インチ(約145cm)になるまで","5歳になるまで","小学校を卒業するまで"],"explain":"原則として8歳、または身長4フィート9インチ(約145cm)に達するまでは適切な安全装置の使用が求められます。"},{"id":278,"catKey":"safety","correct":0,"q":"エアバッグが装備された助手席に、後ろ向きのチャイルドシートを設置することについて正しいのはどれですか?","choices":["原則として禁止されている","問題なく設置してよい","エアバッグを外せば設置してよい"],"explain":"エアバッグが作動した際に後ろ向きチャイルドシートに強い衝撃を与える危険があるため、原則として禁止されています。"},{"id":279,"catKey":"signs","correct":0,"q":"八角形(オクタゴン)の形をした標識が意味するのはどれですか?","choices":["一時停止(STOP)","譲れ(YIELD)","工事中"],"explain":"八角形の標識は、書かれている文字に関わらず常に「一時停止」を意味します。","img":"data:image/gif;base64,R0lGODlhNAAyAMQAAFp 0,000／60,000／15,000ドル","100,000／300,000／50,000ドル"],"explain":"最低補償額は、1人の死傷30,000ドル、複数人の死傷60,000ドル、物損15,000ドルです。","src":"DMVハンドブック"},{"id":292,"catKey":"safety","correct":0,"q":"16歳未満の同乗者がシートベルトをしていない場合、違反切符を受ける可能性があるのは誰ですか？","choices":["運転者","誰も受けない","後部座席なら誰も受けない"],"explain":"同乗者が16歳未満なら、運転者が違反切符を受けることがあります。","src":"DMVハンドブック"},{"id":293,"catKey":"emergency","correct":2,"q":"赤色灯を点滅させたスクールバスで止まらなかった場合、どうなる可能性がありますか？","choices":["警告のみ","100ドル以下の罰金のみ","最高1,000ドルの罰金と1年間の運転特権停止"],"explain":"最高1,000ドルの罰金に加え、運転特権が1年間停止されることがあります。","src":"DMVハンドブック"},{"id":294,"catKey":"dmv","correct":1,"q":"18歳未満が筆記試験に落ちた場合、再受験まで何日待ちますか（不合格の日を除く）？","choices":["待たなくてよい","7日","30日"],"explain":"18歳未満は、不合格の日を除いて7日待ちます。","src":"DMVハンドブック"},{"id":295,"catKey":"dmv","correct":1,"q":"筆記試験は、再申請が必要になるまでに何回受けられますか？","choices":["1回","3回","5回"],"explain":"3回まで受験でき、すべて不合格なら再申請が必要です。","src":"DMVハンドブック"},{"id":296,"catKey":"emergency","correct":0,"q":"工事区間での交通違反の罰金について正しいのはどれですか？","choices":["1,000ドル以上になることがある","他の場所と必ず同じ","警告のみで罰金はない"],"explain":"工事区間での違反の罰金は1,000ドル以上になることがあります。","src":"DMVハンドブック"},{"id":297,"catKey":"emergency","correct":1,"q":"火災や事故の現場を見に車で向かうとどうなる可能性がありますか？","choices":["問題ない","逮捕されることがある","昼間なら問題ない"],"explain":"火災や事故、災害の現場へ車で向かうと、逮捕されることがあります。","src":"DMVハンドブック"}],
en:[{"id":0,"catKey":"signals","correct":1,"q":"At an intersection with stop signs on all four approaches, two cars arrive at the stop line at almost the same time. Which one has the right-of-way?","choices":["Whichever car signaled a right turn first","The car on the right","The larger car","The car going straight"],"explain":"When cars arrive at the same time, the car on the right has the right-of-way. If one car arrived first, that car has the right-of-way."},{"id":1,"catKey":"dui","correct":1,"q":"For a driver age 21 or older, what blood alcohol concentration (BAC) is considered driving under the influence (DUI)?","choices":["0.05%","0.08%","0.10%","0.12%"],"explain":"In California, a general driver 21 or older is considered DUI at a BAC of 0.08% or higher (0.04% for commercial drivers)."},{"id":2,"catKey":"dui","correct":1,"q":"What is the BAC limit under the \"Zero Tolerance\" law that applies to drivers under 21?","choices":["0.00%","0.01%","0.05%","0.08%"],"explain":"Drivers under 21 are held to a much stricter standard: a BAC of 0.01% or higher is a violation."},{"id":3,"catKey":"defensive","correct":1,"q":"What is the general guideline recommended for keeping a safe following distance behind the car ahead of you?","choices":["The 1-second rule","The 3-second rule","The 5-second rule","One car length"],"explain":"The basic rule is to keep enough distance that at least 3 seconds pass between the car ahead passing a fixed point and you passing that same point."},{"id":4,"catKey":"emergency","correct":2,"q":"On a road with no physical median, a school bus ahead has its red lights flashing and is stopped, including traffic in the opposite direction. What must you do?","choices":["Just slow down","You may proceed slowly","Traffic in both directions must come to a complete stop","Only vehicles behind the bus must stop"],"explain":"On an undivided road, traffic in both directions—including oncoming traffic—must come to a complete stop until the school bus's flashing red lights turn off."},{"id":5,"catKey":"emergency","correct":0,"q":"If there's a physical median (such as a landscaped divider) in the middle of the road, which vehicles are exempt from stopping when a school bus stops?","choices":["Vehicles on the opposite side of the median","Vehicles in the same lane as the school bus","No vehicles are exempt","All vehicles are exempt at every intersection"],"explain":"On a road with a physical median, vehicles on the opposite side of the median are not required to stop."},{"id":6,"catKey":"signals","correct":1,"q":"When a railroad crossing's warning signal is active, how far before the tracks must you stop?","choices":["At least 5 feet","At least 15 feet","At least 50 feet","At least 100 feet"],"explain":"While the warning signal is active, you must stop at least 15 feet from the nearest rail."},{"id":7,"catKey":"emergency","correct":1,"q":"What should you do when passing an emergency vehicle stopped on the shoulder (a patrol car with flashing red or amber lights, a tow truck, etc.)?","choices":["Continue in the same lane at the same speed","Move over a lane if possible, or slow down if you can't","Honk your horn to let them know you're passing","Always come to a complete stop"],"explain":"Under the \"Move Over\" law, you should change lanes if possible, or slow to a safe speed if you can't."},{"id":8,"catKey":"signals","correct":1,"q":"At an intersection with no sign specifically prohibiting it, which of the following about turning right on a red light is correct?","choices":["It's prohibited under all circumstances","You may turn right after coming to a complete stop and checking that it's safe","You may turn right by slowing down, without a full stop","You need a police officer's permission"],"explain":"Unless a \"No Turn on Red\" sign is posted, turning right on red is allowed after coming to a complete stop and confirming it's safe for traffic and pedestrians."},{"id":9,"catKey":"parking","correct":0,"q":"Which of the following about stopping or parking where the curb is painted red is correct?","choices":["Stopping and parking are always prohibited","You may park for up to 15 minutes","Only loading/unloading cargo is allowed","It's a disabled parking space"],"explain":"A red curb always indicates a no-stopping, no-parking zone."},{"id":10,"catKey":"parking","correct":2,"q":"What is a curb painted \"yellow\" mainly used for?","choices":["Disabled parking","Passenger loading only","Loading/unloading freight","A space reserved for fire trucks"],"explain":"A yellow curb mainly indicates short-term parking for loading and unloading freight."},{"id":11,"catKey":"parking","correct":2,"q":"Within what distance of a fire hydrant is parking prohibited?","choices":["5 feet","10 feet","15 feet","25 feet"],"explain":"Parking within 15 feet of a fire hydrant is prohibited because it could block firefighting efforts in an emergency."},{"id":12,"catKey":"weather","correct":1,"q":"What does California law require when it's raining hard enough that you need your wipers on?","choices":["Turn on your hazard lights","Turn on your headlights","Only drive slowly","There's no specific requirement"],"explain":"When weather conditions require you to run your wipers due to poor visibility, the law requires you to turn on your headlights."},{"id":13,"catKey":"defensive","correct":1,"q":"Which of the following about using a cell phone while driving is correct under California law?","choices":["Holding the phone to talk is legal","Hands-free use is generally allowed","It cannot be used at all except while stopped","There's no restriction if you're 18 or older"],"explain":"Holding and operating a cell phone to talk while driving is prohibited; generally only hands-free use is allowed."},{"id":14,"catKey":"pedestrians","correct":0,"q":"What should a driver do when a pedestrian is crossing in a crosswalk?","choices":["Stop and yield until the pedestrian has finished crossing","Honk the horn to get their attention","The pedestrian should yield to the car","You may proceed as long as you slow down"],"explain":"A pedestrian in a crosswalk always has the right-of-way, and the driver must stop and yield."},{"id":15,"catKey":"signals","correct":1,"q":"Which of the following about the meaning of a yellow light is correct?","choices":["It's a signal to speed up and clear the intersection","You must stop if you can do so safely","It can be ignored just like a red light","It's always a signal to stop and wait"],"explain":"A yellow light is a warning that the signal is about to turn red — stop if you can safely, and only proceed with caution if you're already too close to the intersection to stop."},{"id":16,"catKey":"highway","correct":1,"q":"On a narrow mountain road where you and an oncoming car can't pass each other, which car should yield (and back up if necessary)?","choices":["The car going uphill","The car going downhill","The larger vehicle","The faster vehicle"],"explain":"The car heading downhill can generally back up more easily, so it has the duty to yield."},{"id":17,"catKey":"lanes","correct":1,"q":"Which of the following describes a situation where you must NOT make a U-turn?","choices":["Anywhere in a residential area","Where you don't have a clear view for 200 feet in both directions","Always prohibited within an intersection","Only prohibited on roads with a high speed limit"],"explain":"A U-turn is prohibited anywhere that other vehicles cannot see your car for 200 feet in either direction."},{"id":18,"catKey":"signals","correct":0,"q":"What is the basic rule for entering a roundabout?","choices":["Yield to vehicles already in the circle","The entering vehicle always has priority","It's first-come, first-served since there's no signal","The vehicle on the right always has priority"],"explain":"In a roundabout, vehicles already circulating have the right-of-way, and entering vehicles must wait for a gap and yield."},{"id":19,"catKey":"provisional","correct":1,"q":"During the first 12 months after getting a provisional license, which of the following is generally true about passenger restrictions for a driver under 18?","choices":["There are no passenger restrictions","Passengers under 20 generally cannot ride along (with some exceptions)","Only family members may ride along","A maximum of 2 passengers is allowed"],"explain":"For the first 12 months, you may not transport passengers under 20 unless accompanied by a licensed parent or guardian, a licensed driver 25 or older, or a certified driving instructor."},{"id":20,"catKey":"provisional","correct":1,"q":"Also during the provisional period, during what hours is a driver under 18 generally restricted from driving?","choices":["5:00 a.m. to 11:00 p.m.","11:00 p.m. to 5:00 a.m.","Driving is not allowed at all","Only weekends are restricted"],"explain":"For the first 12 months after licensing, driving is generally restricted from 11:00 p.m. to 5:00 a.m. (with exceptions for school, work, etc.)."},{"id":21,"catKey":"parking","correct":1,"q":"When is it generally permitted for a car to drive in a bicycle lane?","choices":["As a shortcut during traffic congestion","When changing lanes within 200 feet of a turn","Any time there's no parking space available","Any time no bicycles are visible"],"explain":"Cars must not drive in a bicycle lane except in specific permitted cases, such as within 200 feet before a right or left turn."},{"id":22,"catKey":"safety","correct":2,"q":"Which of the following about California's seat belt law is correct?","choices":["Only the driver is required to wear one","Only front-seat passengers are required to wear one","The driver and all passengers are required to wear one","It's only required on freeways"],"explain":"Regardless of seating position, the driver and all passengers are required to wear seat belts."},{"id":23,"catKey":"safety","correct":1,"q":"Under California law, until what age is a child generally required to ride in a rear-facing car seat (with exceptions based on weight/height)?","choices":["Under 1 year old","Under 2 years old","Under 4 years old","Under 8 years old"],"explain":"Generally, children under 2 must ride in a rear-facing car seat (with exceptions once they exceed a certain weight or height)."},{"id":24,"catKey":"weather","correct":3,"q":"Which of the following does NOT affect a vehicle's stopping distance?","choices":["Speed","The driver's reaction time","Road surface conditions","The color of the car's body"],"explain":"Stopping distance is affected by speed, reaction time, road conditions, and tire condition, but not by the color of the vehicle."},{"id":25,"catKey":"lanes","correct":0,"q":"Before moving into a lane, what must you do to check whether it's clear?","choices":["Turn your head and look back","Check the left side mirror","Check the rearview mirror"],"explain":"Mirrors leave blind spots. Always turn your head and look over your shoulder before moving into a lane.","src":"Past Exam #1"},{"id":26,"catKey":"defensive","correct":1,"q":"If you're angry or emotionally worked up, what should you do?","choices":["Drive to take your mind off the problem","\"Cool off\" before you start driving","Calm yourself down while driving"],"explain":"Anger and strong emotions impair judgment. Calm down before you start driving.","src":"Past Exam #2"},{"id":27,"catKey":"dmv","correct":2,"q":"If an accident causes more than $1,000 in property damage, you must file a report (SR-1) with DMV:","choices":["Only if the vehicle isn't insured","Only if you were at fault","Regardless of who was at fault"],"explain":"If property damage exceeds $1,000 or anyone is hurt or killed, you must report to DMV within 10 days, no matter who caused the collision.","src":"Past Exam #3"},{"id":28,"catKey":"weather","correct":0,"q":"When driving in dense fog, besides slowing down considerably, what should you do?","choices":["Switch your headlights to low beam","Switch your headlights to high beam","Turn on only your parking lights"],"explain":"High beams reflect off fog and create glare. Use low beams in fog.","src":"Past Exam #4"},{"id":29,"catKey":"dmv","correct":0,"q":"Within how many days must you report the sale or transfer of your vehicle to the DMV?","choices":["Within 5 days","Within 10 days","Within 20 days"],"explain":"When you sell or transfer a vehicle, notify DMV within 5 days.","src":"Past Exam #5"},{"id":30,"catKey":"pedestrians","correct":1,"q":"You must watch out for a person riding a bicycle in the same lane as your car, because they:","choices":["Must ride facing the flow of traffic","Have a right to share the road with you","Have the right-of-way"],"explain":"Bicyclists have the same right to use the road as drivers. They don't always have the right-of-way, but you must watch out for them.","src":"Past Exam #6"},{"id":31,"catKey":"lanes","correct":2,"q":"A yellow line is used to separate:","choices":["Lanes on a one-way road","A bike lane from regular traffic","Traffic moving in opposite directions"],"explain":"Yellow lines separate traffic moving in opposite directions. White lines separate lanes moving in the same direction.","src":"Past Exam #7"},{"id":32,"catKey":"signals","correct":0,"q":"At a railroad crossing with no gates or signals, if you can't see the tracks clearly for 400 feet in either direction, what is the speed limit?","choices":["15 mph","25 mph","30 mph"],"explain":"At a crossing where you can't see the tracks for 400 feet in both directions, the limit is 15 mph.","src":"Past Exam #8"},{"id":33,"catKey":"dui","correct":0,"q":"The \"implied consent law\" means that you agree to a chemical test of your blood alcohol content:","choices":["Any time you drive in California","Based on your attorney's advice","Only when an accident occurs"],"explain":"By driving in California, you are deemed to have consented to a chemical test if arrested for DUI.","src":"Past Exam #9"},{"id":34,"catKey":"defensive","correct":1,"q":"While waiting to turn left, you must yield to oncoming traffic:","choices":["Until at least two cars have passed","Until there are no more oncoming cars close enough to be dangerous","Until five cars have passed"],"explain":"Wait until no oncoming vehicle is close enough to be a hazard. It isn't based on a number of cars.","src":"Past Exam #10"},{"id":35,"catKey":"weather","correct":2,"q":"When is the road most slippery?","choices":["During a heavy downpour","During a light drizzle","At the start of rain after a long dry spell"],"explain":"When rain first starts after a dry spell, water mixes with oil on the pavement and makes the road especially slippery.","src":"Past Exam #11"},{"id":36,"catKey":"signs","correct":0,"img":"data:image/gif;base64,R0lGODlhKgAyAMQAAMzMzDAwMCUlJfHx8ezs7Lm5ufv7+2ZmZsPDw4iIiPb29tXV1aamptvb20lJSePj4zc3Nzg4OEBAQDU1NT09PTY2Nj8/Pzk5OT4+Pjw8PPn5+Ts7O/z8/Do6Ov39/f///yH5BAAAAAAALAAAAAAqADIAAAX/oCd6hqacimZw3GcMCnkadEloKmqcOL4ans/HYzKlaDAOrKgopYoqJo5TLGmCwqx2O+QODUKScGXcFRkJhnrNbrsZhTg8XkAgHkQOycMQ+P+AgX8Bg4GEAgEQARcJAyswBxMSkxCTFhQbFBURGxEVAR0SFhWiARMTAakdFxcTEB0CCB9GBwGiGKIdGR0WAg4bhBKnERSnExWnFRnGFxkWFgEFHCketZOTGA4SngwKAAAJAQ4WEhuox4SppqgUGBnRHjMHlRIYG/QSDB4wIpHaGBbMTbjQYYKAWuYyvIo2rck8bRIoZCCWQMGAiwQMhMN0gULEVK0uYKhkqgKGCQWI/1xJMMGBS20WLjgAYGbAB2seJejCEEGcBAGfUEGgEO2DRQ8sr2mj4EAAA6MsGDiAUEHbhqrCQHVwkOrYhp8I4g3gYA2XgwjbDgwg8KFAJEQSpkLE0AGDSK7rJlAQkJLDikj1PBaMC8CbnwkZTkaQ9MyCS3WmqH4NgKCGhgMy6131KCDBhz4xiX4idOBeBmQDJQRbiGAaJAguI25gFcBzAQGifp4Sd8DBBAxdhW3qsGEDX9dIYTvgSQECcAYGAGSgULB3b5cdEp0FGqBCM7SUZw1AKmmSxFBOPwBIdZXQblQZyt0bhmtSAACzYiSIYDWCu5/6FNBdMhcQgksEF2yQjf8pnlBATi9hlXCTJO6QE19nbYGyG2QjCYQMKKbMZsEEAMhAVkvEfWVfNw9UgAggBl4ADTLIQDBQBKHcR8UOpaFFz4sMTFNAAgUswMABSHLlCSqkDOSgiveZQMQB2ZBzQT4JOJVCCy1ooQEDAfDkCl2TnIZWLESkgJk2EyTwwAcI1GZAA3UgUKedCIA5zmwdUBABghjgQmI8PIIXZFu9FPDBAmc50I55qCxyTE/NgZIYKwuIoEJvElSUYUFPIYVIOqRCsMspGWQA0WnC4JemP2wtEKYw+iiwQAK44opkb8AJ8EoEAhDTJ38VlPhqmyZgVlwAamkQRhcG3EDAAw304YD/M3FZCJYIJczTAAcCSrBLUwk00MACDVg0Xhb7aJAABOSQkqpIsXxxmQQPGKCaMxR0dBhpu+pamAcC rective lenses restriction, you may not drive without them, even on familiar routes.","src":"Past Exam #24"},{"id":49,"catKey":"defensive","correct":1,"q":"What is a turnout (a space alongside the road where you can pull over) for?","choices":["Resting when you're tired","Letting other cars pass","Cooling down your car's engine"],"explain":"Turnouts let slower vehicles pull aside so that traffic behind can pass.","src":"Past Exam #25"},{"id":50,"catKey":"defensive","correct":1,"q":"If you're convicted of littering while driving, does it go on your driving record?","choices":["Yes, if you're 18 or younger","Yes, regardless of your age","No"],"explain":"A littering conviction goes on your driving record regardless of your age.","src":"Past Exam #26"},{"id":51,"catKey":"defensive","correct":2,"q":"To avoid a \"close call,\" how far ahead should you look down the road to check for hazards?","choices":["4 to 5 seconds ahead","6 to 8 seconds ahead","10 to 15 seconds ahead"],"explain":"Look far ahead so you can spot hazards early. The current handbook says to scan at least 10 seconds ahead.","src":"Past Exam #27"},{"id":52,"catKey":"defensive","correct":0,"q":"Should you frequently check traffic behind your car?","choices":["Yes, so you're aware if a car is following closely behind you","No, you should focus on the car ahead","No, unless traffic is extremely heavy"],"explain":"Checking behind you regularly tells you when a car is following too closely, so you can respond in time.","src":"Past Exam #28"},{"id":53,"catKey":"lanes","correct":2,"q":"You're following too closely behind the car ahead, and another car suddenly cuts in front of you. What is the best response?","choices":["Slam on the brake pedal","Swerve into the next lane","Ease off the gas pedal"],"explain":"Sudden braking or swerving can cause a crash. Take your foot off the gas to open up space.","src":"Past Exam #29"},{"id":54,"catKey":"safety","correct":0,"q":"Can a passenger age 16 or older receive a ticket for not wearing a seat belt?","choices":["Yes","Yes, but only if seated in the front seat","No"],"explain":"A passenger 16 or older can be ticketed personally for not wearing a seat belt, wherever they're sitting.","src":"Past Exam #30"},{"id":55,"catKey":"lanes","correct":1,"q":"When you pull out of your lane to pass another car, how do you know you have enough room to return to your original lane?","choices":["When you've passed the other car's front bumper","When you can see both of the other car's headlights in your rearview mirror","When you have three car-lengths of space from the other car"],"explain":"When you can see both headlights of the passed car in your rearview mirror, you have room to return to your lane.","src":"Past Exam #31"},{"id":56,"catKey":"defensive","correct":0,"q":"Collisions are most likely to happen when:","choices":["A driver goes faster or slower than the flow of traffic","On a bridge or overpass","On a freeway with many lanes"],"explain":"Driving faster or slower than the flow of traffic makes a collision more likely.","src":"Past Exam #32"},{"id":57,"catKey":"defensive","correct":0,"q":"What is defensive driving?","choices":["A driving technique for survival","Being polite to other drivers","Something only practiced by truck drivers"],"explain":"Defensive driving is a survival technique: you anticipate others' mistakes and avoid hazards early.","src":"Past Exam #33"},{"id":59,"catKey":"signals","correct":1,"q":"Is it ever acceptable to block an intersection?","choices":["Yes, if you entered on a green or yellow light and couldn't clear the intersection before it turned red","No, never","Yes, if the lane next to you is blocked"],"explain":"Whatever the signal color, don't enter an intersection unless you can get completely across without blocking it.","src":"Past Exam #35"},{"id":61,"catKey":"pedestrians","correct":0,"q":"What must you always do for a pedestrian carrying a white cane or being led by a guide dog?","choices":["Always yield the right-of-way to them","Only yield the right-of-way when they're at a corner","Tell them when it's safe to cross"],"explain":"Always yield to a pedestrian using a white cane or guide dog.","src":"Past Exam #37"},{"id":62,"catKey":"signals","correct":2,"q":"Entering an intersection is a violation in which of the following cases?","choices":["When the signal is yellow","When the red light is flashing and you haven't come to a complete stop yet","When you can't cross without blocking crossing traffic"],"explain":"It's a violation to enter an intersection if you can't cross without blocking cross traffic.","src":"Past Exam #38"},{"id":63,"catKey":"parking","correct":2,"q":"When parking facing downhill on a two-way road, how should your front wheels be positioned?","choices":["Turned left, away from the curb","Parallel to the curb","Turned right, toward the curb"],"explain":"Downhill, turn your front wheels toward the curb (right). If the car rolls, the curb stops it.","src":"Past Exam #39"},{"id":64,"catKey":"pedestrians","correct":2,"q":"If a pedestrian is crossing at an intersection with no traffic control and no marked crosswalk:","choices":["The car has the right-of-way","The car should slow down and proceed carefully","The pedestrian has the right-of-way"],"explain":"Even without signals or a marked crosswalk, a pedestrian crossing at an intersection has the right-of-way.","src":"Past Exam #40"},{"id":65,"catKey":"signs","correct":2,"img":"data:image/gif;base64,R0lGODlhKgAyAMQAAMzMzDAwMCUlJfHx8ezs7Lm5ufv7+2ZmZsPDw4iIiPb29tXV1aamptvb20lJSePj4zc3Nzg4OEBAQDU1NT09PTY2Nj8/Pzk5OT4+Pjw8PPn5+Ts7O/z8/Do6Ov39/f///yH5BAAAAAAALAAAAAAqADIAAAX/oCd6hqacimZw3GcMCnkadEloKmqcOL4ans/HYzKlaDAOrKgopYoqJo5TLGmCwqx2O+QODUKScGXcFRkJhnrNbrsZhTg8XkAgHkQOycMQ+P+AgX8Bg4GEAgEQARcJAyswBxMSkxCTFhQbFBURGxEVAR0SFhWiARMTAakdFxcTEB0CCB9GBwGiGKIdGR0WAg4bhBKnERSnExWnFRnGFxkWFgEFHCketZOTGA4SngwKAAAJAQ4WEhuox4SppqgUGBnRHjMHlRIYG/QSDB4wIpHaGBbMTbjQYYKAWuYyvIo2rck8bRIoZCCWQMGAiwQMhMN0gULEVK0uYKhkqg es":["Never","To keep up with the flow of traffic","Only on certain freeways"],"explain":"You may exceed 55 mph only on certain freeways where a higher limit is set.","src":"Past Exam #56"},{"id":81,"catKey":"dmv","correct":0,"q":"Which of the following counts as unlawful use of a driver's license?","choices":["Keeping your license after the DMV has asked you to surrender it","Photocopying your license as part of a job application file","Keeping an expired out-of-state license"],"explain":"Keeping a license after DMV has asked you to surrender it is unlawful.","src":"Past Exam #57"},{"id":82,"catKey":"pedestrians","correct":2,"q":"Which of the following is NOT considered a pedestrian?","choices":["A person with a disability using a motorized wheelchair","A person with a disability using a motorized quadricycle","A person riding a motorized bicycle (moped)"],"explain":"A moped rider isn't a pedestrian. A person with a disability using a motorized wheelchair or similar device is.","src":"Past Exam #58"},{"id":83,"catKey":"signals","correct":1,"q":"What is a \"blind\" intersection? It's an intersection where you cannot:","choices":["See 50 feet to the left and right from a point 100 feet before the intersection","See 100 feet to the left and right from a point 100 feet before the intersection","See 200 feet to the left and right from a point 100 feet before the intersection"],"explain":"An intersection is blind if you can't see 100 feet in either direction during the last 100 feet before it. The limit is 15 mph.","src":"Past Exam #59"},{"id":84,"catKey":"highway","correct":0,"q":"Should you keep a \"cushion of space\" around your car whenever possible?","choices":["Yes, it gives you time to react if another driver makes a mistake","No, a cushion of space isn't necessary — it wastes valuable freeway space","No, because someone will just cut into it"],"explain":"A space cushion gives you time to react if another driver makes a mistake.","src":"Past Exam #60"},{"id":85,"c  the other side of the road","You must remain stopped as long as the red light is flashing"],"explain":"Stay stopped for as long as the school bus's red lights are flashing.","src":"Past Exam #80"},{"id":105,"catKey":"signals","correct":0,"q":"At a railroad crossing controlled by automatic signals or flashing lights, you must:","choices":["Stop, and proceed if it's safe","Slow down before crossing","Stop only when you can see a train coming"],"explain":"Stop at a crossing with active signals, and go only when it's safe.","src":"Past Exam #81"},{"id":106,"catKey":"lanes","correct":1,"q":"On a one-way road, you can generally make a left turn:","choices":["From any lane, if it's safe","Only from the leftmost lane","From either the left or right lane"],"explain":"On a one-way road, turn left from the far-left lane.","src":"Past Exam #82"},{"id":107,"catKey":"defensive","correct":0,"q":"Unless it's necessary for safety, driving so slowly that you obstruct the normal, reasonable flow of traffic is:","choices":["A violation of law","A driver's right","Legal, but not a great idea"],"explain":"Driving so slowly that you block normal traffic, when not needed for safety, is illegal.","src":"Past Exam #83"},{"id":109,"catKey":"parking","correct":0,"q":"When parking facing uphill on a two-way road, how should your front wheels be positioned?","choices":["Turned left, backed up until they touch the curb","Parallel to the curb, with the parking brake set","Turned right until they touch the curb"],"explain":"Uphill with a curb, turn your front wheels left, away from the curb, and let the car roll back until a front wheel rests against it.","src":"Past Exam #85"},{"id":110,"catKey":"defensive","correct":0,"q":"If you're unsure whether you should turn your headlights on, a good rule of thumb is:","choices":["Turn them on any time it's hard to see other cars","Don't turn them on if it would bother other drivers","Turn them on exactly one hour after sunset"],"explain":"If you find it hard to see other cars, turn on your headlights.","src":"Past Exam #86"},{"id":111,"catKey":"highway","correct":0,"q":"Chronic traffic congestion and slowdowns are often caused by which driver behavior?","choices":["Inattention (eating breakfast, shaving, checking a map, or applying makeup while driving)","Driving quickly past an accident scene","Letting another driver merge in ahead of you on the freeway"],"explain":"Inattention, such as eating, grooming, or reading a map while driving, contributes to traffic jams.","src":"Past Exam #87"},{"id":112,"catKey":"defensive","correct":2,"q":"There are times you need to keep more than a \"3-second gap\" from the car ahead of you. One such case is when:","choices":["You're driving slower than the posted speed limit","You're following a small passenger car","A driver behind you is tailgating you closely"],"explain":"With a tailgater behind you, leave more room ahead so you won't have to brake suddenly.","src":"Past Exam #88"},{"id":114,"catKey":"defensive","correct":0,"q":"What general rule should passenger car drivers follow regarding the blind spots of large trucks and buses?","choices":["If you can't see that vehicle's mirrors, you should assume its driver can't see you either","If a vehicle has 8 mirrors, it has no blind spots","You're not in a blind spot unless you're within 6 feet"],"explain":"If you can't see a truck's or bus's mirrors, assume its driver can't see you.","src":"Past Exam #90"},{"id":115,"catKey":"dmv","correct":0,"q":"If you're the first person to arrive to help at an accident scene, you should park off the roadway:","choices":["After passing the accident scene","Before reaching the accident scene","Right next to the accident scene"],"explain":"Park off the road past the scene, so you don't block traffic or rescuers.","src":"Past Exam #91"},{"id":116,"catKey":"lanes","correct":0,"img":"data:image/gif;base64,R0lGODlhKgAyAMQAAIKCgvr6+r29ve7u7kdHR/b29jg4OP39/ZGRkdTU1FVVVSgoKFxcXA4ODtra2vHx8Zqamt3d3aOjo7i4  do so","When you have a clear view in both directions","When the gate appears to be malfunctioning"],"explain":"It is always illegal to go around or under a lowered crossing gate.","src":"Past Exam #95"},{"id":120,"catKey":"signals","correct":0,"q":"You're in a right-turn-only lane about to turn right, and a yellow arrow appears in your lane. What should you do?","choices":["Prepare to obey the next signal","Watch for pedestrians and turn carefully","Stop your car — you must not turn under any circumstances"],"explain":"A yellow arrow means the protected turn is ending. Prepare to obey the next signal.","src":"Past Exam #96"},{"id":121,"catKey":"dmv","correct":1,"q":"You were in a traffic accident and someone was injured. Where should you submit the accident report form?","choices":["The California Highway Patrol (CHP)","The DMV (Department of Motor Vehicles)","Your own insurance company"],"explain":"For a collision with any injury or death, or property damage over $1,000, file an SR-1 with DMV.","src":"Past Exam #97"},{"id":122,"catKey":"signs","correct":0,"q":"What does this sign mean?","choices":["The road curves to the left ahead","You may not turn left","You may turn left only on a green arrow"],"explain":"This warning sign means the road curves left ahead.","src":"Past Exam #98","img":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj4KICA8cmVjdCB4PSIxNSIgeT0iMTUiIHdpZHRoPSI3MCIgaGVpZ2h0PSI3MCIgZmlsbD0iI0ZGRkZGRiIgc3Ryb2tlPSIjMDAwMDAwIiBzdHJva2Utd2lkdGg9IjMiIHRyYW5zZm9ybT0icm90YXRlKDQ1IDUwIDUwKSIvPgogIDxwYXRoIGQ9Ik0gNjggNjggTCA2OCA0MiBRIDY4IDI4IDU0IDI4IEwgMzQgMjgiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzAwMDAwMCIgc3Ryb2tlLXdpZHRoPSI1Ii8+CiAgPHBvbHlnb24gcG9pbnRzPSIzNCwyOCA0NCwyMiA0NCwzNCIgZmlsbD0iIzAwMDAwMCIvPgo8L3N2Zz4="},{"id":123,"catKey":"signs","correct":1,"q":"A sign above the left-turn lane reads \"LEFT TURN YIELD ON GREEN.\" What does this mean?","choices":["You may turn left only on a green arrow","You m
